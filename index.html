<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frequency Explorer — Hyde &amp; Associates</title>
<style>
:root{
  --qh:132px; --th:52px;
  /* Hyde & Associates palette, measured on hydeandassociates.com 17 Sep 2026 */
  --charcoal:#2F3437; --teal:#A0BCBF; --copper:#99694C; --stone:#DCDDD7;
  --ground:#F7F6F3; --surface:#FFFFFF; --sunk:#EFEEEA; --head:#F4F3F0;
  --ink:#2F3437; --ink-2:#443F3F; --label:#5C5A57; --muted:#6B6864; --faint:#A3A19C;
  --rule:#DCDDD7; --rule-2:#C6C7C0;
  --action:#8A5C40; --action-hover:#734A31; --action-ink:#FFFFFF; --focus:#8A5C40;
  --info-bg:#E9F0F1; --info-line:#A0BCBF; --info-ink:#2F3437;
  --pri-bg:#E3F0E8; --pri-ink:#256B43; --pri-line:#2E7D4F;
  --sec-bg:#FBF0D6; --sec-ink:#8A5A00; --sec-line:#B7791F;
  --chip-bg:#EFEEEA; --chip-ink:#2F3437; --chip-line:#DCDDD7;
  --nat-bg:#2F3437; --nat-ink:#FFFFFF; --nat-line:#2F3437; --placeholder:#6B6864; --hl:#E9F0F1;
  --reg-bg:#E1EBEC; --reg-ink:#2F5B60; --reg-line:#A0BCBF;
  --warn-bg:#F6EFE3; --warn-ink:#7A4E12; --crit-bg:#F5E3DF; --crit-ink:#9B2C1F;
  --ver-machine-bg:#EFEEEA; --ver-machine-ink:#5C5A57; --ver-ok-bg:#E3F0E8; --ver-ok-ink:#256B43; --ver-stale-bg:#F5E3DF; --ver-stale-ink:#9B2C1F; --ver-stale-line:#9B2C1F;
  --hover:#F4F3F0; --open:#EEF3F3;
  --shadow:0 1px 2px rgba(47,52,55,.05),0 1px 3px rgba(47,52,55,.07);
  --f:"Avenir Next",Avenir,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:Baskerville,"Libre Baskerville","Baskerville Old Face","Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--f);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1560px;margin-inline:auto;padding-inline:clamp(16px,2.4vw,32px)}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand strong{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:0}
.brand .hex{display:inline-block;width:18px;height:18px;border:2px solid var(--charcoal);transform:rotate(30deg);border-radius:3px;margin-right:8px;vertical-align:-3px}
.top{border-top:3px solid var(--charcoal)}
.brand span{color:var(--muted);font-size:14px}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;font-size:14px}
.chrome{display:flex;align-items:center;gap:14px;position:relative}
.langbtn{border:1px solid var(--rule-2);background:var(--surface);border-radius:6px;padding:4px 9px;font-size:12.5px;font-weight:700;color:var(--label);letter-spacing:.04em}
.langbtn:hover{border-color:var(--label);color:var(--ink)}
.langbtn b{margin-left:4px;color:var(--ink)}
.langpop{position:absolute;right:0;top:calc(100% + 6px);z-index:31;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--rule);border-top:2px solid var(--action);border-radius:10px;box-shadow:0 8px 24px rgba(47,52,55,.14);padding:16px}
.langpop h3{margin:0 0 6px;font-size:15px}
.langpop p{margin:0 0 8px;color:var(--ink-2);font-size:13.5px;line-height:1.5}
.langpop p:last-child{margin:0}
.langpop kbd{font-family:var(--f);font-size:12px;border:1px solid var(--rule-2);border-radius:4px;padding:0 5px;background:var(--sunk)}
.who .name{color:var(--ink-2)}
.acct{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:999px;padding:3px 10px 3px 3px;font-size:14px}
.acct:hover{border-color:var(--rule-2);background:var(--hover)}
.acct .av{width:26px;height:26px;border-radius:999px;background:var(--ink);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.acct .chev{color:var(--label);font-size:11px}
@media print{.top .who,.query,.toolbar .acts,#gate-root,#drawer-root,.toast,.chip button,.infobtn,.exp{display:none!important}.query,.toolbar,thead th{position:static!important}body{background:#fff}main{padding-top:8px}.band>summary::before{content:""}}
.who .name b{font-weight:700}
.linkbtn{border:0;background:none;color:var(--focus);font-weight:600;font-size:14px;padding:4px 2px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:transparent}
.linkbtn:hover{text-decoration-color:currentColor}
.pop{position:absolute;right:0;top:calc(100% + 4px);z-index:30;border-top:2px solid var(--action);width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:16px}
.pop h3{margin:0 0 4px;font-size:15px}
.pop p{margin:0 0 10px;color:var(--label);font-size:13.5px}
.pop ul{list-style:none;margin:0;padding:0}
.pop li{border-top:1px solid var(--rule)}
.pop li button{width:100%;text-align:left;border:0;background:none;padding:10px 4px;display:flex;flex-direction:column;gap:2px}
.pop li button:hover{background:var(--hover)}
.pop li small{color:var(--muted)}

/* query strip */
.query{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
body.has-results .query form{padding-block:12px}
.hint:empty{display:none}
.hintbtn{border:0;background:none;color:var(--focus);font-weight:600;font-size:12px;padding:0 0 0 6px;text-decoration:underline;text-underline-offset:3px}
.query form{display:grid;grid-template-columns:minmax(180px,1.1fr) minmax(200px,1.3fr) 168px 112px 112px 92px auto;gap:12px;align-items:end;padding-block:16px 14px}
@media (max-width:1100px){.query form{grid-template-columns:1fr 1fr 1fr}.query .go{grid-column:1/-1;justify-self:start}}
@media (max-width:640px){.query form{grid-template-columns:1fr 1fr}.field.jur,.field.svc{grid-column:1/-1}}
@media (max-width:640px){.query{position:static}.toolbar{position:static}}
@media (max-width:430px){.dirset label{padding:4px 7px;font-size:12px}.dirset small{display:none}.dirset legend{flex-basis:100%;margin-bottom:4px}.refine .clear{margin-left:0}.tog{font-size:12.5px}}
.field select{width:100%;background:var(--head);border:1px solid var(--faint);border-radius:8px;padding:9px 32px 9px 12px;min-height:42px;font-size:15px;color:var(--ink);appearance:none;-webkit-appearance:none}
.field select:focus{border-color:var(--action);outline:none;box-shadow:0 0 0 3px rgba(14,165,233,.22)}
.field .sel{position:relative}
.field .sel::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--label);font-size:12px}
.field.num input{font-variant-numeric:tabular-nums}
.refine{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-top:2px;min-width:0}
.dirset{border:0;margin:0;padding:0;display:flex;gap:2px;align-items:center;flex-wrap:wrap;min-width:0;max-width:100%}
.dirset legend{float:left;font-size:12.5px;font-weight:700;color:var(--label);margin-right:8px;padding:0}
.dirset label{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--label);padding:4px 10px;border:1px solid var(--rule-2);background:var(--surface);cursor:pointer;margin-left:-1px}
.dirset label:first-of-type{border-radius:8px 0 0 8px;margin-left:0}.dirset label:last-of-type{border-radius:0 8px 8px 0}
.dirset label:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink);position:relative;z-index:1}
.dirset input{position:absolute;opacity:0;width:0;height:0}
.dirset[aria-disabled="true"] label{opacity:.45;cursor:default}
.dirset label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:1px}
.refine .clear{margin-left:auto;font-size:13px;color:var(--label)}
.refine .clear:disabled{opacity:.4;cursor:default;text-decoration:none}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--label);padding:0 4px;cursor:pointer}
.tog input{accent-color:var(--action);width:15px;height:15px;margin:0}
.dirset small,.tog small{font-weight:500;color:var(--muted);font-size:12px}
.dirset label:has(input:checked) small{color:#cbd5e1}
.fc{font-weight:600;color:var(--muted);font-size:12px;margin-left:2px}
.fc:empty{display:none}
.dirset label:has(input:checked) .fc{color:#cbd5e1}
.field{display:flex;flex-direction:column;gap:6px;position:relative}
.field label{color:var(--label);font-weight:700;font-size:13px;letter-spacing:.01em}
.field input{width:100%;background:var(--head);border:1px solid var(--faint);border-radius:8px;padding:9px 12px;min-height:42px;font-size:15px;color:var(--ink)}
.field input::placeholder{color:var(--placeholder)}
.field input:focus{border-color:var(--action);outline:none;box-shadow:0 0 0 3px rgba(14,165,233,.22)}
.combo input{padding-right:36px}
.combo .chev{position:absolute;right:12px;bottom:13px;pointer-events:none;color:var(--label);font-size:12px}
.combo-list{position:absolute;z-index:25;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);max-height:320px;overflow:auto;padding:4px;margin:0;list-style:none}
.combo-list li{padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;font-size:14.5px}
.combo-list li[aria-selected="true"],.combo-list li:hover{background:var(--open)}
.combo-list li.group{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;cursor:default;padding-top:10px}
.combo-list li.group:hover{background:none}
.combo-list li.empty{color:var(--muted);cursor:default}
.combo-list .tag{font-size:11px;font-weight:700;color:var(--pri-ink);background:var(--pri-bg);border-radius:999px;padding:1px 8px}
.combo-list .tagn{font-size:11px;color:var(--muted)}
.combo-list .via{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.combo-list .via::before{content:"matches \201C";}
.combo-list .via::after{content:"\201D";}
.go{background:var(--action);color:var(--action-ink);border:0;border-radius:8px;padding:0 22px;min-height:42px;font-weight:700;font-size:15px}
.go:hover{background:var(--action-hover)}
.hint{color:var(--muted);font-size:12.5px;padding-bottom:10px;display:flex;gap:6px 18px;flex-wrap:wrap}
.hint .err{color:var(--crit-ink);font-weight:600}

/* results */
main{padding-block:22px 30px}
.intro{max-width:78ch;color:var(--ink-2)}
.intro h1{font-family:var(--serif);font-size:26px;margin:0 0 10px;font-weight:700;letter-spacing:0;line-height:1.3}
.intro p{margin:0 0 10px}
.intro .cov{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cov div{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;font-size:14px}
.cov b{display:block;font-size:15px}
.cov span{color:var(--muted);display:block}
.intro .scope{margin-top:14px;font-size:13.5px;color:var(--muted)}
.intro .scope b{color:var(--ink-2)}

.jhead{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--teal);border-radius:10px;padding:9px 14px 9px;margin-bottom:10px}
.jhead .r1{display:flex;align-items:center;gap:14px;min-width:0}
.jhead h2{margin:0;font-size:16px;font-weight:800;letter-spacing:0;white-space:nowrap}
.jhead .plan{min-width:0;flex:1;color:var(--ink-2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jhead .plan b{font-weight:700;color:var(--ink)}
.jhead .r2{display:flex;flex-wrap:wrap;gap:4px 22px;margin:6px 0 0;padding:0}
.jhead .r2>div{display:flex;gap:6px;align-items:baseline;min-width:0}
@media (max-width:760px){.jhead .r1{flex-wrap:wrap}.flag{white-space:normal;max-width:100%}}
.jhead dt{color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:0}
.jhead dd{margin:0;font-size:13px;color:var(--ink-2)}
.flag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--sunk);color:var(--ink-2);border:1px solid var(--rule-2);white-space:nowrap;flex:none}
.flag.ok{background:var(--ver-ok-bg);color:var(--ver-ok-ink);border-color:#A9CDB8}
.flag.machine{background:var(--ver-machine-bg);color:var(--ver-machine-ink);border-color:var(--rule-2)}
.flag.stale{background:var(--ver-stale-bg);color:var(--ver-stale-ink);border-color:#D9A79E}
.jhead.stale{border-color:var(--ver-stale-line);background:#FBF3F1}
.stalebar{background:var(--crit-bg);border:1px solid #D9A79E;border-left:4px solid var(--ver-stale-line);border-radius:8px;padding:10px 14px;margin:0 0 12px;font-size:14px;color:var(--ink)}
.stalebar b{color:var(--crit-ink)}
.jhead .ph{font-style:italic;color:var(--muted)}
.jhead .scope{margin:6px 0 0;font-size:12px;color:var(--muted)}
.jhead .stalebar{margin-top:12px}

.toolbar{position:sticky;top:var(--qh);z-index:15;background:var(--surface);display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;margin:0 0 6px;border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow)}
.toolbar .n{font-size:14px;color:var(--ink-2);margin-right:4px}
.toolbar .n b{font-weight:800;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--rule-2);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px;color:var(--ink-2)}
.chip b{font-weight:700;color:var(--ink)}
.chip button{border:0;background:var(--sunk);color:var(--label);width:18px;height:18px;border-radius:999px;font-size:12px;line-height:1;padding:0}
.chip button:hover{background:var(--rule-2);color:var(--ink)}
.toolbar .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vr{width:1px;height:22px;background:var(--rule-2);margin:0 6px}
.btn{background:var(--surface);border:1px solid var(--rule-2);border-radius:8px;padding:0 12px;height:34px;font-size:13.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover);border-color:var(--label)}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--action-ink)}
.btn.primary:hover{background:var(--action-hover)}
.btn.quiet{border-color:transparent;background:none;color:var(--label)}
.btn.quiet:hover{background:var(--sunk)}
.infobtn{width:18px;height:18px;border-radius:999px;border:1px solid var(--rule-2);background:var(--surface);color:var(--label);font-size:11px;font-weight:800;line-height:1;padding:0;margin-left:6px;vertical-align:-3px;text-transform:none;letter-spacing:0}
.infobtn:hover{border-color:var(--action);color:var(--action-hover)}
.legend{position:absolute;z-index:18;top:calc(100% + 6px);left:0;width:min(380px,90vw);background:var(--surface);border:1px solid var(--info-line);border-top:2px solid var(--action);border-radius:10px;padding:12px 14px;box-shadow:0 8px 24px rgba(15,23,42,.14);color:var(--ink-2);font-size:13.5px;text-transform:none;letter-spacing:0;font-weight:500;white-space:normal;line-height:1.5}
.legend p{margin:0 0 6px}
.legend p:last-child{margin:0}
.legend .k{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.banner{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--action);border-radius:8px;padding:10px 14px;margin:8px 0 14px;font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.banner>span{flex:1 1 60ch}

.band{margin-top:8px}
.flat{margin-top:8px}
.band+.band{border-top:1px solid var(--rule);margin-top:6px;padding-top:2px}
.band>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:5px 4px;min-height:40px;box-sizing:border-box;font-size:15px;font-weight:700;border-radius:6px;user-select:none}
.band>summary::-webkit-details-marker{display:none}
.band>summary::before{content:"▸";font-size:12px;color:var(--label);width:12px;align-self:center}
.band[open]>summary::before{content:"▾"}
.band>summary:hover{background:var(--sunk)}
.band>summary small{color:var(--muted);font-weight:600;font-size:13px}
.band>summary .cnt{margin-left:auto;color:var(--muted);font-size:13px;font-weight:600}
.band.locked>summary{cursor:default;color:var(--label)}
.band.locked>summary:hover{background:none}
.band.locked>summary .cnt::after{content:" · access required";font-weight:500}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--rule);border-radius:10px}
thead th{position:sticky;top:calc(var(--qh) + var(--th,52px));z-index:5;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 12px;background:var(--head);border-bottom:1px solid var(--rule)}
thead th:first-child{border-top-left-radius:10px}thead th:last-child{border-top-right-radius:10px}
th.leg-h{overflow:visible}
th.leg-h:has(#legend){z-index:7}
.legend.right{left:auto;right:0}
tbody td{padding:9px 12px;vertical-align:top;border-top:1px solid var(--rule);font-size:14px}
tbody tr:first-child td{border-top:0}
tr.row:hover td{background:var(--hover)}
tr.row.open td{background:var(--open)}
tr.detail td{background:var(--sunk);border-top:1px dashed var(--rule-2);padding:14px 18px 16px}
col.c-range{width:21%}col.c-alloc{width:52%}col.c-fn{width:27%}
.rbtn{display:grid;grid-template-columns:26px 1fr;align-items:start;width:100%;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.rbtn .rt{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.rbtn .chev{flex:none;width:18px;height:18px;border-radius:4px;color:var(--label);font-size:11px;display:grid;place-items:center;margin-top:2px;background:var(--sunk)}
tr.open .rbtn .chev{background:var(--info-bg);color:var(--info-ink)}
.mhz{font-weight:800;font-size:15px;white-space:nowrap;letter-spacing:-.005em;line-height:1.4;font-variant-numeric:tabular-nums}
.diff{display:inline-block;font-size:11px;font-weight:700;color:var(--ink-2);background:var(--sunk);border:1px solid var(--rule-2);border-radius:999px;padding:0 7px;line-height:1.6;vertical-align:1px}
.grp{display:grid;grid-template-columns:82px 1fr;gap:6px 10px;padding:4px 0 4px 10px;border-left:3px solid var(--pri-line);margin-bottom:6px}
.grp.sec{border-left-color:var(--sec-line)}
.grp:last-child{margin-bottom:0}
.grp .st{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 7px;align-self:start;justify-self:start;line-height:1.5}
.grp.pri .st{background:var(--pri-bg);color:var(--pri-ink)}
.grp.sec .st{background:var(--sec-bg);color:var(--sec-ink)}
.grp .st[title]{cursor:help}
.grp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.grp li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;line-height:1.35}
.grp.pri li .svc{font-weight:700;letter-spacing:.01em}
.grp.sec li .svc{font-weight:500;color:var(--ink-2)}
.svc.hit{box-shadow:inset 0 -2px 0 var(--action);padding-bottom:1px}
.dir{font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--chip-bg);border:1px solid var(--chip-line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.dir::before{content:"↓ ";color:var(--info-ink)}
.dir.up::before{content:"↑ ";color:var(--info-ink)}
.dir.ss::before{content:"↔ ";color:var(--info-ink)}
.none{color:var(--muted);font-style:italic;font-size:13px}
.fns{display:flex;flex-wrap:wrap;gap:5px}

/* gate */
.gate{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding:16px}
.gate .scrim{position:absolute;inset:0;z-index:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px)}
.gcard{position:relative;z-index:1;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:14px;box-shadow:0 24px 60px rgba(15,23,42,.35);padding:26px 28px}

.gcard .field input{border-color:var(--rule-2);background:var(--surface)}
.gcard .field input[aria-invalid="true"]{border-color:var(--crit-ink)}
.gcard .terms{margin:14px 0 6px}
.gcard .row2{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px}
.gcard .alt{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule);font-size:14px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.gcard .alt .linkbtn{font-size:15px;font-weight:700}
.gcard .kicker{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--action-hover);margin-bottom:6px}

tr.skel td{padding:12px}
.skelwrap{-webkit-mask-image:linear-gradient(#000 10%,transparent 95%);mask-image:linear-gradient(#000 10%,transparent 95%)}
.more{color:var(--muted);font-size:13px;padding:6px 4px 0}
.sk{height:11px;border-radius:4px;background:var(--sunk);margin:5px 0}
.sk.w1{width:65%}.sk.w2{width:85%}.sk.w3{width:45%}
.capture{background:var(--surface);border:1px solid var(--action);border-radius:12px;padding:20px 22px;margin:14px 0;box-shadow:0 4px 18px rgba(14,165,233,.12)}
.capture h3{margin:0 0 4px;font-size:17px}
.capture>p{margin:0 0 14px;color:var(--label);font-size:14px;max-width:80ch}
.capture .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;max-width:760px}
@media (max-width:640px){.capture .grid{grid-template-columns:1fr}}
.capture .field input{border-color:var(--rule-2)}
.capture .field input[aria-invalid="true"]{border-color:var(--crit-ink)}
.ferr{color:var(--crit-ink);font-size:12.5px;min-height:0}
.terms{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:14px;color:var(--ink-2);max-width:760px}
.terms input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--action);flex:none}
.capture .row2{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.capture .note{font-size:12.5px;color:var(--muted)}

/* states */
.state{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;max-width:86ch}
.state h2{margin:0 0 6px;font-size:20px;font-family:var(--serif);font-weight:700}
.state p{margin:0 0 10px;color:var(--ink-2)}
.state.notheld{border-left:5px solid var(--faint)}
.state.empty{border-left:5px solid var(--rule-2)}
.state.outside{border-left:5px solid var(--faint)}
.state .kicker{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.state form{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:14px}
.state form .field{min-width:260px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--surface);z-index:41;box-shadow:-8px 0 30px rgba(15,23,42,.18);display:grid;grid-template-rows:auto 1fr;outline:none}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--rule)}
.drawer header h2{margin:0;font-size:18px;font-family:var(--serif);font-weight:700}
.drawer header p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.xbtn{border:1px solid var(--rule-2);background:var(--surface);border-radius:8px;width:36px;height:36px;font-size:18px;line-height:1;flex:none}

.drawer nav{border-right:1px solid var(--rule);overflow:auto;padding:12px 10px;background:var(--head)}
.drawer nav h3{margin:4px 6px 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.drawer nav button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:7px 8px;font-size:13.5px;font-family:var(--mono);font-weight:700}
.drawer nav button:hover{background:var(--surface)}
.drawer nav button[aria-current="true"]{background:var(--open);color:var(--info-ink)}
.drawer nav button.na{color:var(--muted);font-weight:600;text-decoration:line-through;text-decoration-color:var(--faint)}
.drawer nav button small{font-family:var(--f);font-weight:600;font-size:11px;color:var(--muted);text-decoration:none}
.drawer article{overflow:auto;padding:20px 24px 40px}
.drawer article h2{font-family:var(--mono);font-size:22px;margin:0 0 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tier{font-family:var(--f);font-size:12px;font-weight:700;letter-spacing:0;border-radius:999px;padding:2px 9px;background:var(--chip-bg);color:var(--ink-2)}
.tier.regional{background:var(--reg-bg);color:var(--reg-ink)}
.tier.national{background:var(--nat-bg);color:var(--nat-ink)}
.fn.national:hover{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}
.verdict{border-radius:8px;padding:10px 14px;margin:12px 0 16px;font-size:14px}
.verdict.no{background:var(--warn-bg);color:var(--warn-ink);border:1px solid #F5D08A}
.verdict.yes{background:var(--pri-bg);color:var(--pri-ink);border:1px solid #A7E3BE}
.verdict b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.verdict i{display:block;margin-top:4px;font-size:12.5px;opacity:.85}
.fntext{font-size:15px;line-height:1.65;max-width:70ch;white-space:pre-line;color:var(--ink)}
.fnmeta{color:var(--muted);font-size:13px;margin:0 0 14px}
.lang{display:flex;gap:6px;margin:0 0 12px}
.lang button{border:1px solid var(--rule-2);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.drawer article.help{padding:16px 24px 40px;overflow:auto;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.drawer article.help h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 4px}
.drawer article.help h3:first-child{margin-top:4px}
.drawer article.help p{margin:0 0 8px}
.drawer form{padding:20px 24px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.drawer form .field{max-width:480px}
.drawer-foot{margin-top:auto;display:flex;gap:8px;padding-top:16px;border-top:1px solid var(--rule)}
.drawer form p{margin:0;color:var(--label);font-size:14px}

.foot{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:14px 0 90px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--rule)}
.foot .linkbtn{font-size:12.5px;color:var(--label)}
body.admin .foot{display:none}
/* code entry */
.codes{display:flex;gap:8px;margin:6px 0 10px}
.codes input{width:46px;height:54px;text-align:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface);color:var(--ink);padding:0}
.codes input:focus{border-color:var(--action);outline:none;box-shadow:0 0 0 3px rgba(138,92,64,.22)}
.codes input:disabled{background:var(--sunk);color:var(--muted)}
@media (max-width:420px){.codes{gap:6px}.codes input{width:40px;height:48px;font-size:20px}}
.cerr{background:var(--crit-bg);color:var(--crit-ink);border:1px solid #D9A79E;border-radius:8px;padding:8px 12px;font-size:13.5px;margin:0 0 10px}
.cerr b{color:var(--crit-ink)}
.proto{margin:16px 0 0;padding-top:12px;border-top:1px dashed var(--rule);font-size:12.5px;color:var(--muted)}
.proto span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;margin-right:6px}
/* administration */
body.admin .query{display:none}
.adm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.adm-head h1{font-family:var(--serif);font-size:24px;margin:0;font-weight:700}
.adm-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:70ch}
.adm-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.adm-tools .field{min-width:260px}
.adm-tools .field input{min-height:38px;padding:6px 12px}
.adm-tools .seg2{display:inline-flex;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.adm-tools .seg2 button{border:0;background:none;padding:0 12px;height:36px;font-size:13px;font-weight:600;color:var(--label);border-left:1px solid var(--rule)}
.adm-tools .seg2 button:first-child{border-left:0}
.adm-tools .seg2 button[aria-pressed="true"]{background:var(--charcoal);color:#fff}
.adm-tools .n{font-size:13.5px;color:var(--label);margin-left:auto}
table.adm{border-radius:10px}

table.adm td:nth-child(5),table.adm td:nth-child(6){white-space:nowrap}
table.adm tbody tr:hover td{background:var(--hover)}
table.adm td.act{white-space:nowrap;text-align:right}
table.adm .type{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 7px;background:var(--sunk);color:var(--label)}
table.adm .type.acct{background:var(--info-bg);color:var(--info-ink)}
table.adm .email{font-family:var(--mono);font-size:12.5px}
table.adm tr.editing td{background:var(--open)}
table.adm tr.editing input{width:100%;min-height:34px;padding:5px 8px;font-size:14px}
.adm-note{font-size:12.5px;color:var(--muted);margin-top:14px;max-width:96ch}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--crit-ink)}
@media (max-width:900px){table.adm,table.adm thead,table.adm tbody,table.adm tr,table.adm td{display:block}table.adm thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}table.adm tbody tr{padding:10px 12px;border-top:1px solid var(--rule)}table.adm tbody td{padding:2px 0;border:0}table.adm td.act{text-align:left;padding-top:6px}}
/* cookie consent */
.cookie{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--charcoal);color:#fff;padding:14px clamp(16px,2.4vw,32px);display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.cookie p{margin:0;flex:1 1 52ch;font-size:13.5px;line-height:1.5;color:#E6E4DF}
.cookie p b{color:#fff}
.cookie .linkbtn{color:#DCDDD7;font-size:13.5px;text-decoration-color:#DCDDD7}
.cookie .acts{display:flex;gap:8px;flex-wrap:wrap}
.cookie .btn{background:transparent;border-color:#8C9296;color:#fff}
.cookie .btn:hover{background:rgba(255,255,255,.08);border-color:#fff}
.cookie .btn.primary{background:var(--teal);border-color:var(--teal);color:var(--charcoal)}
.cookie .btn.primary:hover{background:#B3CACC}
/* dialog, toast, switcher */
dialog{border:1px solid var(--rule);border-radius:12px;padding:22px 26px;max-width:72ch;max-height:85vh;overflow:auto;box-shadow:0 12px 40px rgba(15,23,42,.2)}
dialog::backdrop{background:rgba(15,23,42,.35)}
dialog h2{margin:0 0 8px;font-size:18px}
dialog .legal{color:var(--ink-2);font-size:14px;line-height:1.55}

dialog .legal .meta{font-size:12.5px;color:var(--muted)}
dialog .legal ul{margin:0 0 8px 18px;padding:0}
dialog .legal li{margin:0 0 4px}
dialog .ph{background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:6px 10px;font-size:12.5px;font-weight:700}
.toast{position:fixed;left:16px;bottom:16px;z-index:60;background:var(--ink);color:#fff;border-radius:10px;padding:12px 16px;font-size:14px;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.sw{position:fixed;right:14px;bottom:14px;z-index:50;font-size:12.5px}

/* responsive table */
@media (max-width:900px){
  table.main,table.main>thead,table.main>tbody,table.main>tbody>tr,table.main>tbody>tr>td{display:block}
  table.main>colgroup{display:none}
  table.main>thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table.main>tbody>tr.row{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;padding:12px 14px;border-top:1px solid var(--rule)}
  table.main>tbody>tr.row>td{padding:0;border:0;background:none!important}
  table.main>tbody>tr.row>td.alloc{grid-column:1/-1}
  table.main>tbody>tr.row>td::before{content:attr(data-l);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:4px}
  table.main>tbody>tr.row>td.range::before{content:none}
  tr.row.open{background:var(--open)}

  .toolbar{position:static}
  .query form{padding-block:12px 6px}
}

<section class="query" aria-label="Search">

      <div class="field combo jur" id="jur-combo">

      </div>
      <div class="field combo svc" id="svc-combo">
        <label for="svc">Service <span style="font-weight:500;color:var(--muted)">(optional)</span></label>
        <span class="sicon" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 16 16" focusable="false"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><input id="svc" type="text" role="combobox" aria-expanded="false" aria-controls="svc-list" aria-autocomplete="list" autocomplete="off" placeholder="Type a service or a term such as VSAT" spellcheck="false">

      <div class="field">
        <label for="band">Band</label>
        <div class="sel"><select id="band"><option value="">All bands</option><option value="custom">Custom frequency range</option></select></div>
      </div>
      <div class="field num">
        <label for="f-from">From</label>
        <input id="f-from" type="text" inputmode="decimal" placeholder="e.g. 10.7" autocomplete="off">
      </div>
      <div class="field num">
        <label for="f-to">To</label>
        <input id="f-to" type="text" inputmode="decimal" placeholder="e.g. 12.75" autocomplete="off">
      </div>
      <div class="field">
        <label for="unit">Unit</label>
        <div class="sel"><select id="unit"><option value="khz">kHz</option><option value="mhz">MHz</option><option value="ghz" selected>GHz</option></select></div>

        <button type="button" class="linkbtn clear" id="clear-all" disabled>Clear all</button>

    </form>

  </div>
</section>

pean (ECA)","primary":[{"service":"FIXED","direction":[]},{"service":"FIXED-SATELLITE","direction":["space-to-Earth","Earth-to-space"]}],"secondary":[],"footnotes":["5.484A","5.517A","5.516"],"applications":null,"national_note":"Fixed Links (Infrastructure); Terminals for Satellite Services (space to Earth)","legal_basis":"National Legislation: S.I. 370 of 2009; National Legislation: S.I. 226 of 2020; ERC/DEC/(00)07 ERC/REC 12-03 Annex A; ECC/DEC/(13)01 ECC/DEC/(15)04; See ComReg documents 09/89 and 09/89A; See ComReg d…","differs_from_itu":{"itu_primary":["FIXED","FIXED-SATELLITE (space-to-Earth) (Earth-to-space)","MOBILE"],"itu_secondary":[]}}],"footnotes":{"5.149":{"text":"In making assignments to stations of other services to which the bands:\n13 360-13 410 kHz, 31.5-31.8 GHz in Regions 1 and 3, 25 550-25 670 kHz, 36.43-36.5 GHz, 37.5-38.25 MHz, 42.5-43.5 GHz, 73-74.6 MHz in Regions 1 and 3, 48.94-49.04 GHz, 150.05-153 MHz in Region 1, 76-86 GHz, 322-328.6 MHz, 92-94 GHz, 406.1-410 MHz, 94.1-100 GHz, 608-614 MHz in Regions 1 and 3, 102-109.5 GHz, 1 330-1 400 MHz, 111.8-114.25 GHz, 1 610.6-1 613.8 MHz, 128.33-128.59 GHz, 1 660-1 670 MHz, 129.23-129.49 GHz, 1 718.8-1 722.2 MHz, 130-134 GHz, 2 655-2 690 MHz, 136-148.5 GHz, 3 … [abridged · ref K7M-2Q]","tier":"itu"},"5.339":{"text":"The bands 1 370-1 400 MHz, 2 640-2 655 MHz, 4 950-4 990 MHz and 15.20-15.35 GHz are also allocated to the space research (passive) and Earth exploration-satellite (passive) services on a secondary basis.","tier":"itu"},"5.340":{"text":"All emissions are prohibited in the following bands:\n1 400-1 427 MHz, 2 690-2 700 MHz, except those provided for by No. 5.422, 10.68-10.7 GHz, except those provided for by No. 5.483, 15.35-15.4 GHz, except those provided for by No. 5.511, 23.6-24 GHz, 31.3-31.5 GHz, 31.5-31.8 GHz, in Region 2, 48.94-49.04 GHz, from airborne stations 50.2-50.4 GHz1, 52.6-54.25 GHz, 86-92 GHz, 100-102 GHz, 109.5-111.8 GHz, 114.25-116 GHz, 148.5-151.5 GHz, 164-167 GHz, 182-185 GHz, 190-191.8 GHz, 200-209 GHz, 226-231.5 GHz, 250-252 GHz. (WRC-03)","tier":"itu"},"5.430A":{"text":"The allocation of the frequency band 3 400-3 600 MHz to the mobile, except aeronautical mobile, serviceis subject to agreement obtained under No. 9.21. This frequency band is identified for International Mobile Telecommunications (IMT). This identification does not preclude the use of this frequency band by any application of the services to which it is allocated and does not establish priority in the Radio Regulations. The provisions of Nos. 9.17 and 9.18 shall also apply in the coordination phase.","tier":"itu"},"5.441":{"text":"The use of the bands 4 500-4 800 MHz (space-to-Earth), 6 725-7 025 MHz (Earth-to-space) by the fixed-satellite service shall be in accordance with the provisions of Appendix 30B. The use of the bands 10.7-10.95 GHz (space-to-Earth), 11.2-11.45 GHz (space-to-Earth) and 12.75-13.25 GHz (Earth-to-space) by geostationary-satellite systems in the fixed-satellite service shall be in accordance with the provisions of Appendix 30B.","tier":"itu"},"5.457A":{"text":"In the bands 5 925-6 425 MHz and 14-14.5 GHz, earth stations located on board vessels may communicate with space stations of the fixed-satellite service. Such use shall be in accordance with Resolution 902 (WRC-03). (WRC-03)","tier":"itu"},"5.457B":{"text":"In the bands 5 925-6 425 MHz and 14-14.5 GHz, earth stations located on board vessels may operate with the characteristics and under the conditions contained in Resolution 902 (WRC-03) in Algeria, Saudi Arabia, Bahrain, Comoros, Djibouti, Egypt, United Arab Emirates, Jordan, Kuwait, Libya, Morocco, Mauritania, Oman, Qatar, the Syrian Arab Republic, Sudan, South Sudan, Tunisia and Yemen, in the maritime mobile-satellite service on a secondary basis. Such use shall be in accordance with Resolution 902 (WRC-03). (WRC-12)","tier":"itu"},"5.484A":{"text":"The use of the bands 10.95-11.2 GHz (space-to-Earth), 11.45-11.7 GHz (space-to-Earth), 11.7-12.2 GHz (space-to-Earth) in Region 2, 12.2-12.75 GHz (space-to-Earth) in Region 3, 12.5-12.75 GHz (space-to-Earth) in Region 1, 13.75-14.5 GHz (Earth-to-space), 17.8-18.6 GHz (space-to-Earth), 19.7-20.2 GHz (space-to-Earth), 27.5-28.6 GHz (Earth-to-space), 29.5-30 GHz (Earth-to-space) by a non-geostationary-satellite system in the fixed-satellite service is subject to application of the provisions of No.","tier":"itu"},"5.484B":{"text":"Resolution 155 (WRC-15) shall apply. (WRC-15)","tier":"itu"},"5.487":{"text":"In the band 11.7-12.5 GHz in Regions 1 and 3, the fixed, fixed-satellite, mobile, except aeronautical mobile, and broadcasting services, in accordance with their respective allocations, shall not cause harmful interference to, or claim protection from, broadcasting-satellite stations operating in accordance with the Regions 1 and 3 Plan in Appendix 30. (WRC-03)","tier":"itu"},"5.487A":{"text":"Additional allocation: in Region 1, the band 11.7-12.5 GHz, in Region 2, the band 12.2-12.7 GHz and, in Region 3, the band 11.7-12.2 GHz, are also allocated to the fixed-satellite service (space-to-Earth) on a primary basis, limited to non-geostationary systems and subject to application of the provisions of No. 9.12 for coordination with other non-geostationary-satellite systems in the fixed-satellite service.","tier":"itu"},"5.492":{"text":"Assignments to stations of the broadcasting-satellite service which are in conformity with the appropriate regional Plan or included in the Regions 1 and 3 List in Appendix 30 may also be used for transmissions in the fixed-satellite service (space-to-Earth), provided that such transmissions do not cause more interference, or require more protection from interference, than the broadcasting-satellite service transmissions operating in conformity with the Plan or the List, as appropriate. (WRC-2000)","tier":"itu"},"5.497":{"text":"The use of the band 13.25-13.4 GHz by the aeronautical radionavigation service is limited to Doppler navigation aids.","tier":"itu"},"5.498A":{"text":"The Earth exploration-satellite (active) and space research (active) services operating in the band 13.25-13.4 GHz shall not cause harmful interference to, or constrain the use and development of, the aeronautical radionavigation service. (WRC-97)","tier":"itu"},"5.499A":{"text":"The use of the frequency band 13.4-13.65 GHz by the fixed-satellite service (space-to-Earth) is limited to geostationary-satellite systems and is subject to agreement obtained under No. 9.21 with respect to satellite systems operating in the space research service (space-to-space) to relay data from space stations in the geostationarysatellite orbit to associated space stations in non-geostationary satellite orbits for which advance publication information has been received by the Bureau by 27 November 2015. (WRC-15)","tier":"itu"},"5.499B":{"text":"Administrations shall not preclude the deployment and operation of transmitting earth stations in the standard frequency and time signal-satellite service (Earth-to-space) allocated on a secondary basis in the frequency band 13.4-13.65 GHz due to the primary allocation to FSS (space-to -Earth). (WRC-15)","tier":"itu"},"5.499C":{"text":"The allocation of the frequency band 13.4-13.65 GHz to the space research service on a primary basis is limited to: –satellite systems operating in the space research service (space-to-space) to relay data from space stations in the geostationary-satellite orbit to associated space stations in non-geostationary satellite orbits for which advance publication information has been received by the Bureau by 27 November 2015, –active spaceborne sensors, –satellite systems operating in the space research service (space-to-Earth) to relay data from space stations in the geostationary-satellite orbit .","tier":"itu"},"5.499D":{"text":"In the frequency band 13.4-13.65 GHz, satellite systems in the space research service (space-to-Earth) and/or the space research service (space-to-space) shall not cause harmful interference to, nor claim protection from, stations in the fixed, mobile, radiolocation and Earth exploration-satellite (active) services. (WRC-15)","tier":"itu"},"5.499E":{"text":"In the frequency band 13.4-13.65 GHz, geostationary-satellite networks in the fixed-satellite service (space-to-Earth) shall not claim protection from space stations in the Earth exploration-satellite service (active) operating in accordance with these Regulations, and No. 5.43A does not apply. The provisions of No. 22.2 do not apply to the Earth exploration-satellite service (active) with respect to the fixed-satellite service (space-to-Earth) in this band. (WRC-15)","tier":"itu"},"5.501A":{"text":"The allocation of the band 13.4-13.75 GHz to the space research service on a primary basis is limited to active spaceborne sensors. Other uses of the band by the space research service are on a secondary basis. (WRC-97)","tier":"itu"},"5.501B":{"text":"In the band 13.4-13.75 GHz, the Earth exploration-satellite (active) and space research (active) services shall not cause harmful interference to, or constrain the use and development of, the radiolocation service. (WRC-97)","tier":"itu"},"5.502":{"text":"In the band 13.75-14 GHz, an earth station of a geostationary fixed-satellite service network shall have a minimum antenna diameter of 1.2 m and an earth station of a non-geostationary fixed-satellite service system shall have a minimum antenna diameter of 4.5 m. In addition, the e.i.r.p., averaged over one second, radiated by a station in the radiolocation or radionavigation services shall not exceed 59 dBW for elevation angles above 2° and 65 dBW at lower angles.","tier":"itu"},"5.503":{"text":"In the band 13.75 - 14 GHz, geostationary space stations in the space research service for which information for advance publication has been received by the Bureau prior to 31 January 1992 shall operate on an equal basis with stations in the fixed-satellite service; after that date, new geostationary space stations in the space research service will operate on a secondary basis.","tier":"itu"},"5.504":{"text":"The use of the band 14-14.3 GHz by the radionavigation service shall be such as to provide sufficient protection to space stations of the fixed-satellite service.","tier":"itu"},"5.504A":{"text":"In the band 14-14.5 GHz, aircraft earth stations in the secondary aeronautical mobile-satellite service may also communicate with space stations in the fixed-satellite service. The provisions of Nos. 5.29, 5.30 and 5.31 apply. (WRC-03)","tier":"itu"},"5.504B":{"text":"Aircraft earth stations operating in the aeronautical mobile-satellite service in the band 14-14.5 GHz shall comply with the provisions of Annex 1, Part C of Recommendation ITU-R M.1643, with respect to any radio astronomy station performing observations in the 14.47-14.5 GHz band located on the territory of Spain, France, India, Italy, the United Kingdom and South Africa. (WRC-03)","tier":"itu"},"5.504C":{"text":"In the frequency band 14-14.25 GHz, the power flux-density produced on the territory of the countries of Saudi Arabia, Bahrain, Botswana, Côte d’Ivoire, Egypt, Guinea, India, Iran (Islamic Republic of), Kuwait, Nigeria, Oman, the Syrian Arab Republic and Tunisia by any aircraft earth station in the aeronautical mobile-satellite service shall not exceed the limits given in Annex 1, Part B of Recommendation ITU-R M.1643-0, unless otherwise specifically agreed by the affected administration(s).","tier":"itu"},"5.506":{"text":"The band 14-14.5 GHz may be used, within the fixed-satellite service (Earth-to-space), for feeder links for the broadcasting-satellite service, subject to coordination with other networks in the fixed-satellite service. Such use of feeder links is reserved for countries outside Europe.","tier":"itu"},"5.506A":{"text":"In the band 14-14.5 GHz, ship earth stations with an e.i.r.p. greater than 21 dBW shall operate under the same conditions as earth stations located on board vessels, as provided in Resolution 902 (WRC-03). This footnote shall not apply to ship earth stations for which the complete Appendix 4 information has been received by the Bureau prior to 5 July 2003. (WRC-03)","tier":"itu"},"5.506B":{"text":"Earth stations located on board vessels communicating with space stations in the fixed-satellite service may operate in the frequency band 14-14.5 GHz without the need for prior agreement from Cyprus, Greece and Malta, within the minimum distance given in Resolution 902 (WRC-03) from these countries. (WRC-03)","tier":"itu"},"5.508":{"text":"Additional allocation: in Germany, France, Italy, Libya, North Macedonia and the United Kingdom, the frequency band 14.25-14.3 GHz is also allocated to the fixed service on a primary basis. (WRC-19)","tier":"itu"},"5.508A":{"text":"In the band 14.25-14.3 GHz, the power flux-density produced on the territory of the countries of Saudi Arabia, Botswana, China, Côte d’Ivoire, Egypt, France, Guinea, India, Iran (Islamic Republic of), Italy, Kuwait, Lesotho, Nigeria, Oman, the Syrian Arab Republic, the United Kingdom and Tunisia by any aircraft earth station in the aeronautical mobile-satellite service shall not exceed the limits given in Annex 1, Part B of Recommendation ITU-R M.1643, unless otherwise specifically agreed by the affected administration(s).","tier":"itu"},"5.509A":{"text":"In the band 14.3-14.5 GHz, the power flux-density produced on the territory of the countries of Saudi Arabia, Botswana, Cameroon, China, Côte d’Ivoire, Egypt, France, Gabon, Guinea, India, Iran (Islamic Republic of), Italy, Kuwait, Lesotho, Morocco, Nigeria, Oman, the Syrian Arab Republic, the United Kingdom, Sri Lanka, Tunisia and Viet Nam by any aircraft earth station in the aeronautical mobile-satellite service shall not exceed the limits given in Annex 1, Part B of Recommendation ITU-R M.1643, unless otherwise specifically agreed by the affected administration(s).","tier":"itu"},"5.509B":{"text":"The use of the frequency bands 14.5-14.75 GHz in countries listed in Resolution 163 (WRC-15) and 14.5-14.8 GHz in countries listed in Resolution 164 (WRC-15) by the fixed-satellite service (Earth-to-space) not for feeder links for the broadcasting-satellite service is limited to geostationary-satellites. (WRC-15)","tier":"itu"},"5.509C":{"text":"For the use of the frequency bands 14.5-14.75 GHz in countries listed in Resolution 163 (WRC-15) and 14.5-14.8 GHz in countries listed in Resolution 164 (WRC-15) by the fixed-satellite service (Earth-to-space) not for feeder links for the broadcasting-satellite service, the fixed-satellite service earth stations shall have a minimum antenna diameter of 6 m and a maximum power spectral density of -44.5 dBW/Hz at the input of the antenna. The earth stations shall be notified at known locations on land. (WRC-15)","tier":"itu"},"5.509D":{"text":"Before an administration brings into use an earth station in the fixed-satellite service (Earth-to-space) not for feeder links for the broadcasting-satellite service in the frequency bands 14.5-14.75 GHz (in countries listed in Resolution 163 (WRC-15)) and 14.5-14.8 GHz (in countries listed in Resolution 164 (WRC-15)), it shall ensure that the power flux-density produced by this earth station does not exceed -151.5 dB(W/(m2 · 4 kHz)) produced at all altitudes from 0 m to 19 000 m above sea level at 22 km seaward from all coasts, defined as the low-water mark, as officially recognized by each c.","tier":"itu"},"5.509E":{"text":"In the frequency bands 14.50-14.75 GHz in countries listed in Resolution 163 (WRC-15) and 14.50-14.8 GHz in countries listed in Resolution 164 (WRC-15), the location of earth stations in the fixed-satellite service (Earth-to-space) not for feeder links for the broadcasting-satellite service shall maintain a separation distance of at least 500 km from the border(s) of other countries unless shorter distances are explicitly agreed by those administrations. No. 9.17 does not apply.","tier":"itu"},"5.509F":{"text":"In the frequency bands 14.50-14.75 GHz in countries listed in Resolution 163 (WRC-15) and 14.50-14.8 GHz in countries listed in Resolution 164 (WRC-15), earth stations in the fixed-satellite service (Earth-tospace) not for feeder links for the broadcasting-satellite service shall not constrain the future deployment of the fixed and mobile services. (WRC-15)","tier":"itu"},"5.509G":{"text":"The frequency band 14.5-14.8 GHz is also allocated to the space research service on a primary basis. However, such use is limited to the satellite systems operating in the space research service (Earth-to-space) to relay data to space stations in the geostationary-satellite orbit from associated earth stations.","tier":"itu"},"5.510":{"text":"Except for use in accordance with Resolution 163 (WRC-15) and Resolution 164 (WRC-15), the use of the frequency band 14.5-14.8 GHz by the fixed-satellite service (Earth-to-space) is limited to feeder links for the broadcasting-satellite service. This use is reserved for countries outside Europe. Uses other than feeder links for the broadcasting-satellite service are not authorized in Regions 1 and 2 in the frequency band 14.75-14.8 GHz. (WRC-15)","tier":"itu"},"5.511A":{"text":"The band 15.43-15.63 GHz is also allocated to the fixed-satellite service (space-to-Earth) on a primary basis. Use of the band 15.43-15.63 GHz by the fixed-satellite service (space-to-Earth and Earth-to-space) is limited to feeder links of non-geostationary systems in the mobile-satellite service, subject to coordination under No. 9.11A.","tier":"itu"},"5.511C":{"text":"Stations operating in the aeronautical radionavigation service shall limit the effective e.i.r.p. in accordance with Recommendation ITU-R S.1340. The minimum coordination distance required to protect the aeronautical radionavigation stations (No. 4.10 applies) from harmful interference from feeder-link earth stations and the maximum e.i.r.p. transmitted towards the local horizontal plane by a feeder-link earth station shall be in accordance with Recommendation ITU-R S.1340. (WRC-97)","tier":"itu"},"5.511E":{"text":"In the frequency band 15.4-15.7 GHz, stations operating in the radiolocation service shall not cause harmful interference to, or claim protection from, stations operating in the aeronautical radionavigation service. (WRC12)","tier":"itu"},"5.511F":{"text":"In order to protect the radio astronomy service in the frequency band 15.35-15.4 GHz, radiolocation stations operating in the frequency band 15.415.7 GHz shall not exceed the power flux-density level of -156 dB(W/m2) in a 50 MHz bandwidth in the frequency band 15.35-15.4 GHz, at any radio astronomy observatory site for more than 2 per cent of the time. (WRC12)","tier":"itu"},"5.512":{"text":"Additional allocation: in Algeria, Saudi Arabia, Austria, Bahrain, Bangladesh, Brunei Darussalam, Cameroon, Congo (Rep. of the), Egypt, El Salvador, the United Arab Emirates, Eritrea, Finland, Guatemala, India, Indonesia, Iran (Islamic Republic of), Jordan, Kenya, Kuwait, Lebanon, Libya, Malaysia, Mali, Morocco, Mauritania, Montenegro, Nepal, Nicaragua, Niger, Oman, Pakistan, Qatar, Syrian Arab Republic, the Dem. Rep.","tier":"itu"},"5.513":{"text":"Additional allocation: in Israel, the band 15.7-17.3 GHz is also allocated to the fixed and mobile services on a primary basis. These services shall not claim protection from or cause harmful interference to services operating in accordance with the Table in countries other than those included in No. 5.512.","tier":"itu"},"5.513A":{"text":"Spaceborne active sensors operating in the band 17.2-17.3 GHz shall not cause harmful interference to, or constrain the development of, the radiolocation and other services allocated on a primary basis. (WRC-97)","tier":"itu"},"5.516":{"text":"The use of the band 17.3-18.1 GHz by geostationary-satellite systems in the fixed-satellite service (Earth-to-space) is limited to feeder links for the broadcasting-satellite service. The use of the band 17.3-17.8 GHz in Region 2 by systems in the fixed-satellite service (Earth-to-space) is limited to geostationary satellites. For the use of the band 17.3-17.8 GHz in Region 2 by feeder links for the broadcasting-satellite service in the band 12.2- 12.7 GHz, see Article 11.","tier":"itu"},"5.516A":{"text":"In the band 17.3-17.7 GHz, earth stations of the fixed-satellite service (space-to-Earth) in Region 1 shall not claim protection from the broadcasting-satellite service feeder-link earth stations operating under Appendix 30A, nor put any limitations or restrictions on the locations of the broadcasting-satellite service feeder link earth stations anywhere within the service area of the feeder link. (WRC-03)","tier":"itu"},"5.516B":{"text":"The following bands are identified for use by high-density applications in the fixed-satellite service: 17.3-17.7 GHz (space-to-Earth) in Region 1 18.3-19.3 GHz (space-to-Earth) in Region 2 19.7-20.2 GHz (space-to-Earth) in all Regions 39.5-40 GHz (space-to-Earth) in Region 1 40-40.5 GHz (space-to-Earth) in all Regions 40.5-42 GHz (space-to-Earth) in Region 2 47.5-47.9 GHz (space-to-Earth) in Region 1 48.2-48.54 GHz (space-to-Earth) in Region 1 49.44-50.2 GHz (space-to-Earth) in Region 1 and 27.5-27.82 GHz (Earth-to-space) in Region 1 28.35-28.45 GHz (Earth-to-space) in Region 2 28.45-28.94 GH.","tier":"itu"},"5.517A":{"text":"The operation of earth stations in motion communicating with geostationary fixed-satellite service space stations within the frequency bands 17.7-19.7 GHz (space-to- Earth) and 27.5-29.5 GHz (Earth-to-space) shall be subject to the application of Resolution 169 (WRC-19). (WRC-19)","tier":"itu"},"5.547B":{"text":"Alternative allocation: in the United States, the band 31.8-32 GHz is allocated to the radionavigation and space research (deep space) (space-to-Earth) services on a primary basis. (WRC-97)","tier":"itu"},"ECA20":{"text":"This fixed service band is designated for common use by civil and non civil users. Any user priorities in respect of preferred channels or sub-bands are to be determined after discussions between interested parties.","tier":"regional"},"ECA26":{"text":"The band 13.25-14.0 GHz is utilised for a variety of radiodetermination applications falling within the radionavigation and radiolocation services. This band will be subject to further detailed consideration.","tier":"regional"},"ECA28":{"text":"CEPT administrations shall not deploy new fixed service systems in the band 11.7-12.5 GHz (ERC/DEC(00)08).","tier":"regional"},"ECA36":{"text":"A frequency band, which has been harmonised by NATO and NATO member nations for military use as defined in the NATO Joint Civil/Military Frequency Agreement (NJFA) 2014. Note: NATO Joint Civil/Military Frequency Agreement (NJFA) - Extract for Public Disclosure, February 2017","tier":"regional"},"ECA37":{"text":"In Europe the allocation to the mobile service is limited to the band 3400-3800 MHz.","tier":"regional"},"IRL1":{"text":"The generic Irish footnote IRL1 covers a variety of short range devices that have been exempted from the requirement to hold a licence.\nThe full list of exempted short range devices can be found in ComReg Doc. - 02/71 (as revised). These include:\n• Alarms;\n• Non-specific Short range devices;\n• Radio microphones and Assisted Listening Devices;\n• RFID;\n• Tracking, tracing and data acquisition; and\n• Wideband data transmission systems","tier":"national"}}},"Brazil":{"iso":"BR","itu_region":2,"plan":"Plano de Atribuição, Destinação e Distribuição de Faixas de Frequências","authority":"Anatel","edition":"January 2020 edition (file dated 31 Oct 2019)","language":"Portuguese (services translated)","regional_table":null,"rows":[{"from_mhz":3400.0,"to_mhz":3410.0,"table":"National","primary":[{"service":"FIXED","direction":[]},{"service":"MOBILE","direction":[]}],"secondary":[{"service":"Amat
