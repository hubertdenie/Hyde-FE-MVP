/* ---------- combobox ---------- */
function combo(inputId,listId,getItems,onPick,emptyText){
  const input=document.getElementById(inputId),list=document.getElementById(listId);
  let idx=-1,items=[],showAll=false;
  function open(){build();list.hidden=false;input.setAttribute('aria-expanded','true')}
  function close(){list.hidden=true;input.setAttribute('aria-expanded','false');idx=-1}
  function build(){
    items=getItems(showAll?'':input.value.trim().toLowerCase());
    list.innerHTML='';
    if(!items.length){list.innerHTML=`<li class="empty">${emptyText||'No matching entry.'}</li>`;return}
    items.forEach((it,i)=>{
      const li=document.createElement('li');
      if(it.group||it.hint){li.className=it.hint?'hint':'group';li.textContent=it.group||it.hint;li.setAttribute('role','presentation');list.appendChild(li);return}
      li.setAttribute('role','option');li.id=listId+'-'+i;li.dataset.i=i;
      if(it.title)li.title=it.title;
      li.innerHTML=`<span>${esc(it.label)}${it.sub?`<small class="via">${esc(it.sub)}</small>`:''}${it.terms?`<small class="terms">${esc(it.terms)}</small>`:''}</span>${it.tag?`<span class="${it.tag.cls}">${esc(it.tag.text)}</span>`:''}`;
      li.addEventListener('mousedown',e=>{e.preventDefault();pick(i)});
      list.appendChild(li);
    });
  }
  function pick(i){const it=items[i];if(!it||it.group||it.hint)return;input.value=it.label;close();onPick&&onPick(it)}
  function move(d){
    const sel=[...list.querySelectorAll('[role=option]')];if(!sel.length)return;
    let cur=sel.findIndex(x=>x.getAttribute('aria-selected')==='true');
    cur=(cur+d+sel.length)%sel.length;
    sel.forEach(x=>x.removeAttribute('aria-selected'));sel[cur].setAttribute('aria-selected','true');sel[cur].scrollIntoView({block:'nearest'});
    input.setAttribute('aria-activedescendant',sel[cur].id);idx=+sel[cur].dataset.i;
  }
  /* Selecting the field shows the whole list, even when it already holds a value; typing filters it. */
  input.addEventListener('focus',()=>{showAll=true;open()});
  input.addEventListener('click',()=>{if(list.hidden){showAll=true;open()}});
  input.addEventListener('input',()=>{showAll=false;open();onPick&&onPick(null)});
  input.addEventListener('blur',()=>setTimeout(close,120));
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();if(list.hidden)open();move(1)}
    else if(e.key==='ArrowUp'){e.preventDefault();move(-1)}
    else if(e.key==='Enter'){if(!list.hidden&&idx>=0){e.preventDefault();pick(idx)}else if(!list.hidden){const first=items.findIndex(x=>!x.group&&!x.hint);if(first>=0&&input.value){e.preventDefault();pick(first)}}}
    else if(e.key==='Escape'){close()}
  });
  return {close};
}
combo('jur','jur-list',q=>{
  const vis=HELD.filter(n=>!(JUR[n].withdrawn&&!S.staff));
  const held=vis.filter(n=>n.toLowerCase().includes(q)).map(n=>({label:n,tag:JUR[n].withdrawn?{cls:'tagn',text:'withdrawn, staff only'}:null}));
  const rest=COUNTRIES.filter(n=>(!JUR[n]||(JUR[n].withdrawn&&!S.staff))&&n.toLowerCase().includes(q)).map(n=>({label:n,tag:{cls:'tagn',text:'coming soon'}}));
  const out=[];
  if(!q)out.push({hint:'Type to search, or scroll the list.'});
  out.push(...held);
  if(rest.length){out.push({group:'Coming soon'});out.push(...rest)}
  return out;
});
function svcTermsLine(key){const v=VERN[key];if(!v||!v.terms||!v.terms.length)return '';const seen=new Set();const t=v.terms.filter(x=>x.length<=16&&!seen.has(x.toLowerCase())&&seen.add(x.toLowerCase()));t.sort((a,b)=>(/[A-Z]{2}/.test(b)?1:0)-(/[A-Z]{2}/.test(a)?1:0));return t.length?'Also: '+t.slice(0,5).join(', '):''}
combo('svc','svc-list',q=>{
  if(!q) return [{hint:'Type a service or a common term. Common terms are listed under each service.'},...SERVICES.map(s=>({label:s.label,key:s.key,title:s.desc,terms:svcTermsLine(s.key)}))];
  const direct=SERVICES.filter(s=>s.label.toLowerCase().includes(q)).map(s=>({label:s.label,key:s.key,title:s.desc,terms:svcTermsLine(s.key)}));
  const seen=new Set(direct.map(x=>x.key));const via=[];
  for(const s of SERVICES){if(seen.has(s.key))continue;const a=s.aliases.find(t=>t.toLowerCase().includes(q));if(a){via.push({label:s.label,key:s.key,sub:a,title:s.desc});seen.add(s.key)}}
  const out=[...direct];
  if(via.length){out.push({group:'Matched by common term'});out.push(...via)}
  return out;
},null,'No matching ITU service or common term. Try Fixed-satellite, VSAT or GNSS.');

function verification(name,j){
  // Three states: machine-extracted (not yet reviewed by a person), human-verified with a date, stale (verified but older than the threshold).
  const v=VERIFICATION[name]||j.verification||{status:'machine'};
  if(v.status!=='human'||!v.verified_on) return {state:'machine',label:'Machine-extracted; not yet human-reviewed',dd:'<span class="ph">not yet human-reviewed</span>',cls:'machine'};
  const d=new Date(v.verified_on);const months=(Date.now()-d)/2.63e9;
  const ds=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  if(months>AGE_THRESHOLD_MONTHS) return {state:'stale',label:`Human-reviewed ${ds} \u00b7 review interval exceeded`,dd:`${ds}${v.by?' by '+esc(v.by):''}`,cls:'stale',ds};
  return {state:'human',label:`Human-reviewed ${ds}`,dd:`${ds}${v.by?' by '+esc(v.by):''}`,cls:'ok',ds};
}

const CBX_MIN=12;
function cbxEnhance(sel){

  const list=document.createElement('ul');list.className='cbx-list';list.setAttribute('role','listbox');list.id=inp.id+'-l';list.hidden=true;inp.setAttribute('aria-controls',list.id);

  const btn=document.createElement('button');btn.type='button';btn.className='cbx-btn';btn.tabIndex=-1;btn.setAttribute('aria-label','Show all options');btn.innerHTML='<span aria-hidden="true">▾</span>';
  sel.classList.add('cbx-native');sel.tabIndex=-1;sel.setAttribute('aria-hidden','true');

  host.classList.add('cbx-host');host.parentElement.insertBefore(wrap,host);wrap.appendChild(host);wrap.appendChild(inp);wrap.appendChild(btn);wrap.appendChild(list);
  let items=[],idx=-1;
  const label=()=>{const o=sel.options[sel.selectedIndex];return o&&o.value!==''?o.textContent:''};
  const sync=()=>{inp.value=label();inp.disabled=sel.disabled||!!sel.closest('fieldset:disabled');btn.disabled=inp.disabled;wrap.classList.toggle('bad',sel.getAttribute('aria-invalid')==='true')};
  sel._cbSync=sync;sel.addEventListener('change',sync);
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[+()]/g,'');
  const build=q=>{const n=norm(q.trim());items=[...sel.options].filter(o=>!o.disabled&&o.value!==''&&(!n||norm(o.textContent).includes(n)));
    if(n){const sc=o=>{const s=norm(o.textContent),tk=s.split(/[\s,·/]+/);return tk.includes(n)?0:(s.startsWith(n)||tk.some(x=>x.startsWith(n)))?1:2};items=items.map((o,i)=>[sc(o),i,o]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(x=>x[2])}
    list.innerHTML='';
    if(!items.length){const li=document.createElement('li');li.className='cbx-empty';li.textContent='No match. Check the spelling, or clear the field to see all options.';list.appendChild(li)}
    items.forEach((o,i)=>{const li=document.createElement('li');li.id=list.id+'-'+i;li.setAttribute('role','option');li.setAttribute('aria-selected',String(o.selected));
      const t=o.textContent;const k=n?norm(t).indexOf(n):-1;

      li.onmousedown=e=>{e.preventDefault();pick(i)};list.appendChild(li)});

  const close=(restore=true)=>{list.hidden=true;wrap.classList.remove('open');inp.setAttribute('aria-expanded','false');if(restore&&!inp.value.trim()&&sel.value!==''&&[...sel.options].some(x=>x.value==='')){sel.value='';sel.dispatchEvent(new Event('change',{bubbles:true}))}if(restore)inp.value=label()};
  const pick=i=>{const o=items[i];if(!o)return;const ch=sel.value!==o.value;sel.value=o.value;close();if(ch)sel.dispatchEvent(new Event('change',{bubbles:true}));inp.select()};

function drwValues(){const o={};document.querySelectorAll('#drawer-root #drawer input,#drawer-root #drawer select,#drawer-root #drawer textarea').forEach(e=>{if(!e.id&&!e.name)return;if(e.classList.contains('cbx-in'))return;const k=(e.id||e.name)+(e.type==='radio'||e.type==='checkbox'?':'+e.value:'');o[k]=e.type==='radio'||e.type==='checkbox'?e.checked:e.value});return o}

(function(){const root=document.getElementById('drawer-root');if(!root)return;let wasOpen=false;
  new MutationObserver(()=>{const open=!!root.querySelector('#drawer');
    if(open&&!wasOpen){DRW.opener=DRW.lastFocus||null;setTimeout(()=>{DRW.snap=drwValues()},0)}
    if(!open&&wasOpen){DRW.snap=null;const o=DRW.opener;DRW.opener=null;if(o&&document.contains(o)&&!document.querySelector('#confirm-root .gcard'))setTimeout(()=>{if(!root.querySelector('#drawer'))o.focus()},0)}

  const ask=(redo)=>openConfirm({title:'Discard your changes?',body:'<p>You have edits in this panel that are not saved.</p>',confirm:'Discard changes',cancel:'Keep editing',danger:true,onConfirm:()=>{DRW.bypass=true;DRW.snap=null;redo();DRW.bypass=false}});

/* ---------- partial matching for every search box: each word typed must appear somewhere; digits match with or without separators ---------- */
function pnorm(s){return String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function pcompact(s){return pnorm(s).replace(/(\d)[\s,.  '’](?=\d)/g,'$1')}
function pmatch(hay,q){const h=pnorm(hay),hc=pcompact(hay);return pnorm(q).trim().split(/\s+/).filter(Boolean).every(tok=>h.includes(tok)||hc.includes(pcompact(tok)))}
function toastUndo(msg,undo){const t=$('#toast');t.innerHTML='';const sp=document.createElement('span');sp.textContent=msg+' ';t.appendChild(sp);const b=document.createElement('button');b.type='button';b.className='linkbtn undo';b.textContent='Undo';b.onclick=()=>{undo();t.hidden=true};t.appendChild(b);t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,8000)}

function splitPhone(full,iso){
  if(!full)return {iso:iso||'',num:''};
  const s=String(full).trim();if(!s.startsWith('+'))return {iso:iso||'',num:s};
  const digits=s.replace(/[^\d]/g,'');
  for(const len of [3,2,1]){const cc=digits.slice(0,len);const c=DIAL.filter(d=>String(d[2])===cc);if(c.length){const pick=(iso&&c.find(d=>d[1]===iso))||c.find(d=>d[1]===DIAL_PREF[cc])||c[0];const rest=s.slice(1);let n=0,i=0;while(i<rest.length&&n<len){if(/\d/.test(rest[i]))n++;i++}return {iso:pick[1],num:rest.slice(i).trim()}}}
  return {iso:iso||'',num:s};
}

  if(raw.startsWith('+')){const p=splitPhone(raw,iso);if(p.iso){iso=p.iso;raw=p.num;ccEl.value=iso;ccEl._cbSync&&ccEl._cbSync();phonePre(id)}}

const EM={init:false};
function svcBase(str){const k=svcKey(str);if(VERN[k])return {base:k,qual:''};let best=null;for(const b of Object.keys(VERN)){if((k.startsWith(b+' ')||k.startsWith(b+'('))&&(!best||b.length>best.length))best=b}if(!best)return {base:null,qual:str};return {base:best,qual:str.slice(best.length).trim()}}
function parseAlloc(s,status){const p=svcBase(s.service);return {orig:s.service,service:p.base,qual:p.qual,status,dir:[...(s.direction||[])],o:JSON.stringify([p.base,p.qual,status])}}
function allocName(a){if(a.orig&&JSON.stringify([a.service,a.qual,a.status])===a.o)return a.orig;const b=a.service||'';const n=a.status==='P'?b:titleCase(b);return a.qual?n+' '+a.qual:n}

function emInit(){

  Object.entries(VERN).forEach(([k,v])=>v.terms.forEach(t=>EM.terms.push({term:t,service:k,type:'Common term'})));
  const qs=new Set(['(active)','(passive)','(R)','(OR)','except aeronautical mobile','except aeronautical mobile (R)','(deep space)','(radiobeacons)']);
  Object.entries(JUR).forEach(([name,j])=>{
    const id=j.iso+'-E1';

    EM.ranges[id].forEach(w=>w.allocs.forEach(a=>{if(a.qual)qs.add(a.qual)}));

  EM.quals=[...qs].sort((a,b)=>a.localeCompare(b));

}
const edById=id=>EM.eds.find(e=>e.id===id);
const liveEd=jur=>EM.eds.find(e=>e.jur===jur&&e.status==='published');
const draftEd=jur=>EM.eds.find(e=>e.jur===jur&&e.status==='draft');
function emLog(e){const x={id:EM.seq++,at:nowStamp(),by:actor(),state:'draft',...e};EM.log.unshift(x);return x}
function pendingFor(edId){return EM.log.filter(l=>l.ed===edId&&l.state==='draft')}
function emPendingCount(){if(!EM.init)return 0;return EM.log.filter(l=>l.state==='draft').length}
const rlabel=w=>rangeLabel(w.lo,w.hi);
function hydeFor(jur){return EM.hyde.filter(h=>h.jur===jur)}
function fnText(edId,code){if(/^HA-\d+/.test(code)){const h=EM.hyde.find(x=>x.code===code&&x.jur===edById(edId).jur);return h?h.text:''}const f=EM.fns[edId][code];return f?(f.text||f.text_en||''):''}

function checkRange(edId,w,list){
  const out=[];const ed=edById(edId);
  if(!(w.lo<w.hi))out.push({level:'error',reason:'Lower edge not below upper edge',detail:`${fmtMHz(w.lo)} MHz is not below ${fmtMHz(w.hi)} MHz.`});
  w.allocs.forEach(a=>{if(!a.service)out.push({level:'error',reason:'Service not on the list',detail:`“${a.orig||'Blank'}” does not match any of the ${EM.services.length} services. Choose one from the list.`})});
  w.footnotes.forEach(c=>{if(!fnText(edId,c))out.push({level:'warning',reason:'Footnote code with no text',detail:`${c} is cited but no text is held for it in this edition.`})});
  const same=(list||EM.ranges[edId]).filter(x=>!x.deleted&&x.table===w.table&&x!==w&&x.id!==w.id).sort((a,b)=>a.lo-b.lo);
  const prev=[...same].reverse().find(x=>x.lo<w.lo||(x.lo===w.lo&&x.hi<=w.hi)),next=same.find(x=>x.lo>w.lo||(x.lo===w.lo&&x.hi>w.hi));
  if(w.lo<w.hi){
    const ov=[prev,next].find(x=>x&&x.lo<w.hi&&x.hi>w.lo);
    if(ov)out.push({level:'warning',reason:'Overlaps a neighboring range',detail:`Overlaps ${rlabel(ov)} in the ${ov.table} table.`});
    else{
      if(prev&&prev.hi<w.lo)out.push({level:'warning',reason:'Gap to a neighboring range',detail:`Nothing is recorded between ${fmtMHz(prev.hi)} and ${fmtMHz(w.lo)} MHz.`});
      if(next&&w.hi<next.lo)out.push({level:'warning',reason:'Gap to a neighboring range',detail:`Nothing is recorded between ${fmtMHz(w.hi)} and ${fmtMHz(next.lo)} MHz.`});
    }
    const width=w.hi-w.lo,nb=[prev,next].filter(Boolean).map(x=>x.hi-x.lo);
    if(nb.length&&nb.every(x=>width>x*20))out.push({level:'warning',reason:'Value out of proportion to its neighbors',detail:`${rlabel(w)} is more than twenty times wider than the ranges either side. Check for a typing error.`});
  }
  if(w.printed&&!w.kind)out.push({level:'error',reason:'Correction without a kind of change',detail:'Choose why the printed value was changed.'});
  if(w.kind&&KIND_NEEDS_HYDE.has(w.kind)){const hs=w.footnotes.filter(c=>/^HA-/.test(c)).map(c=>EM.hyde.find(h=>h.code===c&&h.jur===ed.jur)).filter(Boolean);
    if(!hs.length)out.push({level:'error',reason:'Hyde footnote required',detail:`A ${w.kind.toLowerCase()} must carry a Hyde footnote on this range.`});
    else if(!hs.some(h=>h.status==='Final'))out.push({level:'error',reason:'Hyde footnote still in draft',detail:`Set ${hs[0].code} to Final before this range is published.`});}

function emValidate(edId){const list=EM.ranges[edId];list.forEach(w=>{if(w.deleted){w.flags=[];return}const f=checkRange(edId,w,list);w.flags=w.verified?f.filter(x=>x.level==='error'):f})}

const DEMO_FILES={IE:'IE_ComReg_26-14_2026.json',BR:'BR_Anatel_2026.json',MY:'MY_MCMC_2026.json'};
function emImport({jur,ref,date,language,rr}){

  const n=EM.eds.filter(e=>e.jur===jur).length+1;const id=`${live.iso}-E${n}${old?'r'+EM.seq:''}`;

  EM.eds.push(ed);

  EM.fns[id]=clone(EM.fns[live.id]);

  // anomalies as a real extraction produces them, so the review queue has work to show

  if(R[19]&&R[19].allocs[0]){R[19].allocs[0].service=null;R[19].allocs[0].orig='FIXED-SATELITE'}
  if(R[29]){R[29].hi=R[29].hi*10}
  emValidate(id);
  const flagged=R.filter(w=>w.flags.length);
  emLog({ed:id,jur,record:'Plan edition',field:'Import',before:'',after:`${ref} (${R.length} frequency ranges, ${Object.keys(EM.fns[id]).length} footnotes)`,kind:'Import',note:ed.file});
  return {ed,count:R.length,fn:Object.keys(EM.fns[id]).length,flagged:flagged.length,byReason:flagged.flatMap(w=>w.flags).reduce((m,f)=>(m[f.reason]=(m[f.reason]||0)+1,m),{}),replaced:!!old};
}

function publishBlockers(edId){return (EM.ranges[edId]||[]).filter(w=>!w.deleted&&w.flags.some(f=>f.level==='error'))}

function emPublish(edId){
  if(!isAdmin())return {ok:false,msg:'Only an Admin can publish.'};

  const b=publishBlockers(edId);if(b.length)return {ok:false,msg:`Resolve ${b.length} record${b.length===1?'':'s'} with errors before publishing.`};
  let j=JUR[ed.jur];const pend=pendingFor(edId);const isNewJur=!j;
  if(!j){j=JUR[ed.jur]={iso:ed.iso,itu_region:+ed.region,plan:ed.title,authority:ed.regulator,edition:ed.ref,language:ed.language,regional_table:ed.regional||null,rows:[],footnotes:{}};if(!HELD.includes(ed.jur)){HELD.push(ed.jur);HELD.sort()}}
  if(ed.status==='draft'){
    const prev=liveEd(ed.jur);if(prev){prev.status='superseded';prev.supersededOn=isoToday()}

    hydeFor(ed.jur).forEach(h=>{const un=[];(h.cites||[]).forEach(c=>{const w=EM.ranges[edId].find(x=>!x.deleted&&x.lo===c.lo&&x.hi===c.hi);if(w){if(!w.footnotes.includes(h.code))w.footnotes.push(h.code)}else un.push(c)});h.unmatched=un;h.flag=un.length>0});

  j.rows=EM.ranges[edId].filter(w=>!w.deleted).map(w=>toLive(w,ed.jur));

  j.footnotes=fns;
  // rows cite only final Hyde footnotes
  j.rows.forEach(r=>{r.footnotes=r.footnotes.filter(c=>!/^HA-/.test(c)||fns[c])});
  EM.ranges[edId].forEach(w=>{w.isNew=false});

  EM.hyde.filter(h=>h.jur===ed.jur).forEach(h=>{h.pending=false;h.isNew=false;delete h.prev;h.cites=EM.ranges[edId].filter(w=>!w.deleted&&w.footnotes.includes(h.code)).map(w=>({lo:w.lo,hi:w.hi}))});
  emLog({ed:edId,jur:ed.jur,record:'Plan edition',field:'Publication',before:'',after:`${pend.length} change${pend.length===1?'':'s'} published`,kind:'Publish',state:'published'});
  if(S.result&&S.query&&S.query.jur===ed.jur&&!S.adminOpen)runSearch(S.query);
  return {ok:true,msg:isNewJur?`${ed.jur} is published and now appears in the Explorer's jurisdiction list.`:`Published ${pend.length} change${pend.length===1?'':'s'} to ${ed.jur}. They are live in the Explorer.`};
}
function emDiscard(edId){
  const ed=edById(edId);
  if(ed.status==='draft'){EM.eds=EM.eds.filter(e=>e!==ed);delete EM.ranges[edId];delete EM.fns[edId];EM.log.forEach(l=>{if(l.ed===edId&&l.state==='draft')l.state='discarded'});EM.edSel=(liveEd(ed.jur)||EM.eds[0]||{}).id;return}
  const j=JUR[ed.jur];EM.ranges[edId]=j.rows.map(toWork);
  EM.fns[edId]=clone(j.footnotes);Object.keys(EM.fns[edId]).forEach(c=>{if(/^HA-/.test(c))delete EM.fns[edId][c]});
  EM.hyde=EM.hyde.filter(h=>!(h.jur===ed.jur&&h.isNew));EM.hyde.filter(h=>h.jur===ed.jur&&h.prev).forEach(h=>{Object.assign(h,h.prev);delete h.prev;h.pending=false});
  EM.log.forEach(l=>{if(l.ed===edId&&l.state==='draft')l.state='discarded'});
  emValidate(edId);
}
function emPublishRef(){
  if(!isAdmin())return {ok:false,msg:'Only an Admin can publish.'};
  const pend=EM.ref.filter(r=>r.state==='draft');
  pend.forEach(r=>{
    if(r.action==='addTerm'){const s=SERVICES.find(x=>x.key===r.service);if(s&&!s.aliases.includes(r.term))s.aliases.push(r.term);if(VERN[r.service]&&!VERN[r.service].terms.includes(r.term))VERN[r.service].terms.push(r.term);const t=EM.terms.find(x=>x.term===r.term&&x.pending);if(t)t.pending=false}
    if(r.action==='removeTerm'){SERVICES.forEach(s=>s.aliases=s.aliases.filter(a=>a.toLowerCase()!==r.term.toLowerCase()));if(VERN[r.service])VERN[r.service].terms=VERN[r.service].terms.filter(a=>a.toLowerCase()!==r.term.toLowerCase());EM.terms=EM.terms.filter(x=>!(x.term===r.term&&x.removing))}
    if(r.action==='retire'){const s=EM.services.find(x=>x.key===r.service);if(s){s.retired=true;s.pendingRetire=false}}
    if(r.action==='reinstate'){const s=EM.services.find(x=>x.key===r.service);if(s){s.retired=false;s.pendingReinstate=false}}
    r.state='published';r.publishedBy=actor();r.publishedAt=nowStamp();
  });
  emLog({ed:'REF',jur:'All',record:'Services and terms',field:'Publication',before:'',after:`${pend.length} change${pend.length===1?'':'s'} published`,kind:'Publish',state:'published'});

}

function emSetWithdrawn(jur,w){if(!isAdmin())return false;JUR[jur].withdrawn=!!w;const e=liveEd(jur);emLog({ed:e.id,jur,record:'Jurisdiction',field:'Publication',before:w?'In the Explorer':'Withdrawn',after:w?'Withdrawn':'In the Explorer',kind:'Publication control',state:'recorded'});return true}

function emDeleteFootnote(edId,code,kind){const ed=edById(edId);const snap=clone(EM.fns[edId][code]);delete EM.fns[edId][code];emLog({ed:edId,jur:ed.jur,record:code,field:'Footnote deleted',before:`${code}: ${String(snap.text||'').slice(0,90)}`,after:'',kind,raw:{fnDel:code,before:snap,after:null}})}
function rawTarget(l){const r=l.raw||{};return r.edField?'ed:'+r.edField:r.fn?'fn:'+r.fn+':'+r.key:r.fnAdd?'fnx:'+r.fnAdd:r.fnDel?'fnx:'+r.fnDel:(l.rangeId&&r.key)?'rg:'+l.rangeId+':'+r.key:null}
function applyRaw(edId,l,val){const r=l.raw||{};

/* Find frequency: typing "3" lists every range whose lower or upper edge contains a 3 in the chosen unit (3,300; 13,250 …);
   a complete value also finds the range that contains it (12.6 GHz finds 12.5–12.75 GHz); "3300-3400" matches both edges. */
function fmtStamp(s){const m=String(s||'').match(/^(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2})/);return m?`${fmtDate(m[1])}<small class="sub">${m[2]}</small>`:esc(s||'')}
function rangeMatches(w,q,unit){
  const d={khz:1e-3,mhz:1,ghz:1e3}[unit]||1;const edge=v=>String(+(v/d).toPrecision(12));
  const s=String(q).trim().replace(/[\s,  ]/g,'').replace(/[–—]/g,'-');if(!s)return true;
  const parts=s.split('-').filter(Boolean);
  if(parts.length===2)return edge(w.lo).includes(parts[0])&&edge(w.hi).includes(parts[1]);
  const t=parts[0]||s;if(edge(w.lo).includes(t)||edge(w.hi).includes(t))return true;
  const v=parseFloat(t);return !Number.isNaN(v)&&/^\d*\.?\d+$/.test(t)&&w.lo<=v*d&&w.hi>=v*d;
}

     <div class="ferr" role="alert" id="rg-err">${esc(st.err)}</div>
     ${st.confirmDel?`<div class="cerr" role="alert"><b>Delete ${rlabel(orig)} from the draft?</b> It disappears from the Explorer when an Admin publishes. The record stays in the change history.<div class="row2" style="margin-top:8px"><button type="button" class="btn danger" id="rg-del-yes">Delete range</button><button type="button" class="btn" id="rg-del-no">Keep range</button></div></div>`:''}
     <div class="drawer-foot">${ro?'<button class="btn" type="button" id="rg-cancel">Close</button>':`<button class="btn primary" type="submit" id="rg-save">${iss&&!iss.errors.length&&iss.warnings.length?'Save with warnings':'Save draft change'}</button><button class="btn" type="button" id="rg-cancel">Cancel</button>${orig?'<button class="btn quiet" type="button" id="rg-split" style="margin-left:auto">Split range</button><button class="btn danger quiet" type="button" id="rg-del">Delete range</button>':''}`}</div>
    </form></aside>`;
    wire();
  };
  const close=()=>{root.innerHTML='';document.removeEventListener('keydown',k)};const k=ev=>{if(ev.key==='Escape'&&!$('#confirm-root').innerHTML)close()};document.addEventListener('keydown',k);
  const wire=()=>{
    $('#d-close').onclick=close;$('#scrim').onclick=close;$('#rg-cancel').onclick=close;if(ro){$('#drawer').focus();return}
    $('#rg-unit').onchange=()=>{read();st.unit=$('#rg-unit').value;draw()};
    $('#al-add').onclick=()=>{read();w.allocs.push({service:null,qual:'',status:'P',dir:[],orig:null,o:''});w.allocsTouched=true;st.issues=null;draw();$(`#al-s${w.allocs.length-1}`)?.focus()};
    root.querySelectorAll('[data-rm-al]').forEach(b=>b.onclick=()=>{read();w.allocs.splice(+b.dataset.rmAl,1);w.allocsTouched=true;st.issues=null;draw()});
    root.querySelectorAll('[data-rm-fn]').forEach(b=>b.onclick=()=>{read();w.footnotes.splice(+b.dataset.rmFn,1);st.issues=null;draw()});
    $('#fn-add').onchange=()=>{const c=$('#fn-add').value;if(!c)return;read();w.footnotes.push(c);st.issues=null;draw();$('#fn-add-cb')?$('#fn-add-cb').focus():$('#fn-add').focus()};
    $('#fn-new').onclick=()=>{read();const keepW=clone(w),keepSt={...st};close();openNewFootnote(edId,body,{rangeLabel:w.lo!=null&&w.hi!=null?rangeLabel(w.lo,w.hi):'this range',onDone:code=>openRange(edId,rid,body,{w:keepW,st:keepSt,add:code}),onCancel:()=>openRange(edId,rid,body,{w:keepW,st:keepSt})})};
    $('#rg-del')&&($('#rg-del').onclick=()=>{read();st.confirmDel=true;draw();$('#rg-del-yes').focus()});
    $('#rg-del-no')&&($('#rg-del-no').onclick=()=>{st.confirmDel=false;draw()});
    $('#rg-split')&&($('#rg-split').onclick=()=>{const o=orig;close();openConfirm({title:`Split ${rlabel(o)}?`,body:`<p>The range is cut in two at the frequency you enter. Both parts keep the same allocations, footnotes and notes; edit either part afterwards. Saved as draft changes.</p><div class="g2"><div class="field"><label for="sp-at">Split at (MHz)</label><input id="sp-at" data-cf="at" inputmode="decimal" placeholder="Between ${fmtMHz(o.lo)} and ${fmtMHz(o.hi)}"></div><div class="field"><label for="sp-kind">Kind of change</label><div class="sel"><select id="sp-kind" data-cf="kind">${KINDS.map(k=>`<option>${k}</option>`).join('')}</select></div></div></div>`,confirm:'Split range',onConfirm:vals=>{const x=parseNum(vals.at);if(x==null||Number.isNaN(x)||!(x>o.lo&&x<o.hi)){toast(`Enter a frequency between ${fmtMHz(o.lo)} and ${fmtMHz(o.hi)} MHz. Nothing was changed.`);return}
      const before=o.hi;const nw={...clone(o),id:`${ed.jur}:n${EM.rseq++}`,lo:x,hi:before,printed:null,verified:null,isNew:true,flags:[]};
      o.hi=x;o.kind=vals.kind;o.verified=null;list.push(nw);
      emLog({ed:edId,jur:ed.jur,record:rlabel(o),rangeId:o.id,field:'Upper edge',before:fmtMHz(before)+' MHz',after:fmtMHz(x)+' MHz',kind:vals.kind,note:'Split',raw:{key:'hi',before,after:x}});
      emLog({ed:edId,jur:ed.jur,record:rlabel(nw),rangeId:nw.id,field:'Range',before:'',after:`New range ${rlabel(nw)} from the split`,kind:vals.kind,note:'Split',raw:null});
      emValidate(edId);renderEM(body);toast(`Split into ${rlabel(o)} and ${rlabel(nw)} in draft.`)}})});
    $('#rg-del-yes')&&($('#rg-del-yes').onclick=()=>{orig.deleted=true;emLog({ed:edId,jur:ed.jur,record:rlabel(orig),rangeId:orig.id,field:'Range',before:rlabel(orig),after:'Deleted',kind:st.kind||'Deletion',raw:{key:'deleted',before:false,after:true}});emValidate(edId);close();renderEM(body);toast(`${rlabel(orig)} deleted in draft. It stays live until an Admin publishes.`)});
    root.querySelectorAll('input,select,textarea').forEach(x=>x.addEventListener('change',()=>{if(st.issues){st.issues=null;const b=$('#rg-save');if(b)b.textContent='Save draft change'}}));
    $('#rgf').onsubmit=ev=>{ev.preventDefault();read();st.err='';
      if(w.lo==null||w.hi==null){st.err='Enter both edges as numbers.';st.issues=null;draw();$('#rg-lo').focus();return}
      const F=[['lo','Lower edge',x=>fmtMHz(x)+' MHz'],['hi','Upper edge',x=>fmtMHz(x)+' MHz'],['table','Table',x=>x],['allocs','Allocations',x=>x.map(a=>(a.service?titleCase(a.service):a.orig||'?')+(a.qual?' '+a.qual:'')+' ('+(a.status==='P'?'primary':'secondary')+(a.dir.length?', '+a.dir.join(' and '):'')+')').join('; ')],['footnotes','Footnotes',x=>x.join(', ')],['applications','Applications',x=>x],['national_note','National note',x=>x],['legal_basis','Legal basis',x=>x],['pages','Source pages',x=>x]];
      const base=orig||{lo:null,hi:null,table:'',allocs:[],footnotes:[],applications:'',national_note:'',legal_basis:'',pages:''};
      const norm=a=>JSON.stringify((a||[]).map(x=>[x.service,x.qual,x.status,[...x.dir].sort()]));
      const diffs=F.filter(([kk])=>kk==='allocs'?norm(base.allocs)!==norm(w.allocs):kk==='footnotes'?JSON.stringify(base.footnotes)!==JSON.stringify(w.footnotes):String(base[kk]??'')!==String(w[kk]??''));
      if(!diffs.length){close();toast('No changes to save.');return}
      if(!st.kind){st.err='Choose the kind of change.';st.issues=null;draw();$('#rg-kind').focus();return}
      const cand=clone(w);cand.kind=st.kind;cand.verified=null;
      if(orig&&!orig.isNew&&(w.lo!==orig.lo||w.hi!==orig.hi)){cand.printed=orig.printed||{lo:orig.lo,hi:orig.hi};if(cand.printed.lo===cand.lo&&cand.printed.hi===cand.hi)cand.printed=null}
      if(norm(base.allocs)!==norm(w.allocs))cand.allocsTouched=true;
      const others=list.filter(x=>x!==orig);const all=others.concat([cand]);
      const found=checkRange(edId,cand,all);const errors=found.filter(f=>f.level==='error'),warnings=found.filter(f=>f.level==='warning');
      const same=st.issues&&JSON.stringify(st.issues)===JSON.stringify({errors,warnings});
      if(errors.length||(warnings.length&&!same)){st.issues={errors,warnings};draw();$('#rg-save')?.focus();return}
      // commit
      diffs.forEach(([kk,l,f])=>emLog({ed:edId,jur:ed.jur,record:rlabel(cand),rangeId:cand.id,field:l,before:orig?f(base[kk]):'',after:f(cand[kk]),kind:st.kind,note:st.note,raw:{key:kk,before:orig?clone(base[kk]):null,after:clone(cand[kk])}}));
      cand.flags=warnings;
      if(orig){Object.keys(orig).forEach(x=>delete orig[x]);Object.assign(orig,cand)}else{list.push(cand)}
      emValidate(edId);close();renderEM(body);
      toast(`Draft change saved${warnings.length?' with '+warnings.length+' warning'+(warnings.length===1?'':'s'):''}. It goes live when an Admin publishes.`)};
    $('#drawer').focus();
  };
  draw();
}

function citedOnBlock(items,ro,note){
  return `<fieldset class="fs"><legend>Cited on ${items.length} range${items.length===1?'':'s'}</legend>
   ${items.length?`<ul class="hist">${items.map(({e,w})=>`<li><span class="mono">${rlabel(w)}${e&&e.status==='draft'?' <small class="sub" style="display:inline">draft edition</small>':''}</span><button type="button" class="linkbtn" data-cite-open="${esc(e.id)}|${esc(w.id)}">Open range</button></li>`).join('')}</ul>`:'<p class="none">Not cited on any range.</p>'}
   ${ro?'':`<small class="help">${note}</small>`}</fieldset>`;
}

function openHyde(jur,_rangeId,code,body){

  const root=$('#drawer-root');const st={err:'',confirmDel:false};

  const draw=()=>{const cited=hydeCitedOn(jur,h.code);
  root.innerHTML=`<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="h-h" tabindex="-1" id="drawer" style="width:min(640px,100vw);grid-template-rows:auto 1fr">
  <header><div><h2 id="h-h"><span class="mono">${esc(h.code)}</span> · Hyde footnote</h2><p>${esc(jur)} · shown as Hyde's own note, never as the plan's words</p></div><button class="xbtn" id="d-close" aria-label="Close">×</button></header>
  <form id="hf" novalidate>
   ${h.flag?`<div class="cerr"><b>Needs citing again.</b> It was cited on ${(h.unmatched||[]).map(c=>rangeLabel(c.lo,c.hi)).join(', ')}, which the published edition no longer has. Open the matching range and add ${esc(h.code)} there.</div>`:''}
   <div class="field"><label for="hf-text">Text</label><textarea id="hf-text" rows="5">${esc(h.text)}</textarea></div>
   <div class="g2"><div class="field"><label for="hf-reason">Reason</label><div class="sel"><select id="hf-reason">${HYDE_REASONS.map(r=>`<option ${h.reason===r?'selected':''}>${r}</option>`).join('')}</select></div></div>
   <div class="field"><span class="lbl" id="hf-st-l">Status</span><div class="seg2" role="radiogroup" aria-labelledby="hf-st-l">${['Draft','Final'].map(x=>`<label><input type="radio" name="hf-st" value="${x}" ${h.status===x?'checked':''}> ${x}</label>`).join('')}</div><small class="help">Only final Hyde footnotes are published.</small></div></div>
   <div class="field"><span class="lbl" id="hf-v-l">Visibility</span><div class="seg2" role="radiogroup" aria-labelledby="hf-v-l">${[['Internal','Hyde staff only'],['Public','All users']].map(([x,l])=>`<label><input type="radio" name="hf-v" value="${x}" ${h.visibility===x?'checked':''}> ${l}</label>`).join('')}</div></div>
   ${citedOnBlock(cited,false,`To cite it on another range, open that range and add ${esc(h.code)} under Footnotes.`)}
   <div class="ferr" role="alert" id="hf-err">${esc(st.err)}</div>
   ${st.confirmDel?`<div class="cerr" role="alert"><b>Delete ${esc(h.code)}?</b> The change history keeps its text.<div class="row2" style="margin-top:8px"><button type="button" class="btn danger" id="hf-del-yes">Delete Hyde footnote</button><button type="button" class="btn" id="hf-del-no">Keep it</button></div></div>`:''}
   <div class="drawer-foot"><button class="btn primary" type="submit">Save draft change</button><button class="btn" type="button" id="hf-cancel">Cancel</button><button class="btn danger quiet" type="button" id="hf-del" style="margin-left:auto" ${cited.length?`disabled aria-disabled="true" title="Cited on ${cited.length} range${cited.length===1?'':'s'}. Remove it from ${cited.length===1?'that range':'those ranges'} first."`:''}>Delete</button></div>
  </form></aside>`;
  $('#d-close').onclick=close;$('#scrim').onclick=close;$('#hf-cancel').onclick=close;
  root.querySelectorAll('[data-cite-open]').forEach(b=>b.onclick=()=>{const [e,w]=b.dataset.citeOpen.split('|');close();EM.edSel=e;openRange(e,w,body)});
  $('#hf-del').onclick=()=>{if($('#hf-del').disabled)return;st.confirmDel=true;draw()};
  $('#hf-del-no')&&($('#hf-del-no').onclick=()=>{st.confirmDel=false;draw()});
  $('#hf-del-yes')&&($('#hf-del-yes').onclick=()=>{EM.hyde=EM.hyde.filter(x=>x!==h);emLog({ed:liveEd(jur).id,jur,record:h.code,field:'Hyde footnote',before:h.text,after:'Deleted',kind:'Hyde footnote'});close();renderEM(body);toast(`${h.code} deleted.`)});
  $('#hf').onsubmit=ev=>{ev.preventDefault();const text=$('#hf-text').value.trim();

  $('#drawer').focus();};

}
function pgFootnotes(main,body){

function pgQueue(main,body){
  const items=queueItems();const groups={};items.forEach(i=>(groups[i.reason]=groups[i.reason]||[]).push(i));
  const order=Object.keys(groups).sort((a,b)=>{const ea=groups[a][0].level==='error',eb=groups[b][0].level==='error';return ea===eb?a.localeCompare(b):ea?-1:1});
  main.innerHTML=`<div class="em-h"><div><h2>Review queue</h2><p>Records flagged on import or on save. Fix errors in the editor. Mark a warning verified once you have checked it against the plan.</p></div></div>
   ${items.length?order.map(r=>{const g=groups[r];const err=g[0].level==='error';const verifiable=g.filter(i=>!err&&i.w);return `<section class="qgroup"><h3><span class="stchip ${err?'err':'warn'}">${err?'Error':'Warning'}</span> ${esc(r)} <span class="ncnt">${g.length}</span>${verifiable.length>1?`<button class="btn quiet" data-verall="${esc(r)}">Mark all ${verifiable.length} verified</button>`:''}</h3>
     <ul class="qlist">${g.map((i,n)=>`<li><div><b class="mono">${i.w?rlabel(i.w):esc(i.hyde.code)}</b> <span class="sub">${esc(i.ed?edName(i.ed):i.hyde.jur)}${i.ed&&i.ed.status==='draft'?' · draft edition':''}</span><p>${esc(i.detail)}</p></div><div class="act">${i.w?`<button class="btn" data-qopen="${esc(i.ed.id)}|${esc(i.w.id)}">${err?'Fix':'Open'}</button>${err?'':`<button class="btn quiet" data-qver="${esc(i.ed.id)}|${esc(i.w.id)}">Mark verified</button>`}`:`<button class="btn" data-qhyde="${esc(i.hyde.code)}|${esc(i.hyde.jur)}">Open</button>`}</div></li>`).join('')}</ul></section>`}).join('')
   :'<div class="state empty"><div class="kicker">Nothing to review</div><h2>The review queue is empty</h2><p>Records flagged when a plan is imported, or when a change is saved with warnings, appear here.</p></div>'}`;
  const ver=(edId,rid)=>{const w=EM.ranges[edId].find(x=>x.id===rid);w.verified={by:actor(),on:isoToday()};w.flags=w.flags.filter(f=>f.level==='error');emLog({ed:edId,jur:edById(edId).jur,record:rlabel(w),rangeId:w.id,field:'Verification',before:'',after:`Verified by ${actor()}`,kind:'Verification',state:'recorded'});return w};
  main.querySelectorAll('[data-qopen]').forEach(b=>b.onclick=()=>{const [e,r]=b.dataset.qopen.split('|');openRange(e,r,body)});
  main.querySelectorAll('[data-qver]').forEach(b=>b.onclick=()=>{const [e,r]=b.dataset.qver.split('|');const w=ver(e,r);renderEM(body);toast(`${rlabel(w)} marked verified by ${actor()}.`)});
  main.querySelectorAll('[data-qhyde]').forEach(b=>b.onclick=()=>{const [c,j]=b.dataset.qhyde.split('|');openHyde(j,null,c,body)});
  main.querySelectorAll('[data-verall]').forEach(b=>b.onclick=()=>{const g=groups[b.dataset.verall].filter(i=>i.w);openConfirm({title:`Mark ${g.length} records verified?`,body:`<p>Confirm you have checked each against the plan. Your name and today's date are recorded on every one.</p>`,confirm:`Mark ${g.length} verified`,onConfirm:()=>{g.forEach(i=>ver(i.ed.id,i.w.id));renderEM(body);toast(`${g.length} records marked verified.`)}})});
}

     ${bl.length?`<div class="cerr"><b>${bl.length} record${bl.length===1?' has':'s have'} errors.</b> The edition cannot be published until ${bl.length===1?'it is':'they are'} fixed. <button class="linkbtn" data-go="queue">Open the review queue</button></div>`:''}

  main.querySelectorAll('[data-disc]').forEach(b=>b.onclick=()=>{if(b.disabled)return;const e=edById(b.dataset.disc);const isNewEd=e.status==='draft';const n=pendingFor(e.id).length;
    openConfirm({title:isNewEd?`Discard the draft edition ${e.ref}?`:`Discard ${n} draft change${n===1?'':'s'} to ${e.jur}?`,body:`<p>${isNewEd?'The imported edition and its edits are removed. The published edition is not affected.':'The working copy returns to what is published. Discarded changes stay visible in the change history.'} This cannot be undone.</p>`,confirm:isNewEd?'Discard edition':'Discard changes',danger:true,onConfirm:()=>{emDiscard(e.id);renderStaffArea();toast(isNewEd?'Draft edition discarded.':'Draft changes discarded.')}})});
  main.querySelectorAll('[data-disc1]').forEach(b=>b.onclick=()=>{const l=EM.log.find(x=>x.id===+b.dataset.disc1);if(emDiscardOne(l)){renderStaffArea();toast(`Change to ${l.field.toLowerCase()} on ${l.record} discarded.`)}else toast('This change cannot be discarded on its own. Discard all changes instead.')});
