,07-23,12 GHz, 171,11-171 … [abridged · ref R4V-8H]","tier":"itu","text_en":"In making assignments to stations of other services to which the bands:\n13 360-13 410 kHz, 31.5-31.8 GHz in Regions 1 and 3, 25 550-25 670 kHz, 36.43-36.5 GHz, 37.5-38.25 MHz, 42.5-43.5 GHz, 73-74.6 MHz in Regions 1 and 3, 48.94-49.04 GHz, 150.05-153 MHz in Region 1, 76-86 GHz, 322-328.6 MHz, 92-94 GHz, 406.1-410 MHz, 94.1-100 GHz, 608-614 MHz in Regions 1 and 3, 102-109.5 GHz, 1 330-1 400 MHz, 111.8-114.25 GHz, 1 610.6-1 613.8 MHz, 128.33-128.59 GHz, 1 660-1 670 MHz, 129.23-129.49 GHz, 1 718.8-1 722.2 MHz, 130-134 GHz, 2 655-2 690 MHz, 136-148.5 GHz, 3 260-3 267 MHz, 151.5-158.5 GHz, 3 332-3 ."},"5.282":{"text":"O serviço de radioamador por satélite pode operar nas faixas 435-438 MHz, 1260-1270 MHz, 2400-2450 MHz, 3400-3410 MHz (somente nas Regiões 2 e 3) e 5650-5670 MHz, sujeito a não causar interferência prejudicial aos outros serviços operando de acordo com a Tabela (ver o nº 5.43). As Administrações ao autorizarem tal uso deverão garantir que qualquer interferência prejudicial causada por emissões oriundas de uma estação do serviço de radioamador por satélite seja imediatamente eliminada, conforme as disposições do nº 25.11.","tier":"itu","text_en":"In the bands 435-438 MHz, 1 260-1 270 MHz, 2 400-2 450 MHz, 3 400-3 410 MHz (in Regions 2 and 3 only) and 5 650-5 670 MHz, the amateur-satellite service may operate subject to not causing harmful interference to other services operating in accordance with the Table (see No. 5.43). Administrations authorizing such use shall ensure that any harmful interference caused by emissions from a station in the amateur-satellite service is immediately eliminated in accordance with the provisions of No. 25.11."},"5.339":{"text":"As faixas 1370-1400 MHz, 2640-2655 MHz, 4950-4990 MHz e 15,20-15,35 GHz estão também atribuídas aos serviços de pesquisa espacial (passivo) e de exploração da Terra por satélite (passivo), em caráter secundário.","tier":"itu","text_en":"The bands 1 370-1 400 MHz, 2 640-2 655 MHz, 4 950-4 990 MHz and 15.20-15.35 GHz are also allocated to the space research (passive) and Earth exploration-satellite (passive) services on a secondary basis."},"5.340":{"text":"Todas as emissões estão proibidas nas seguintes faixas de frequências: 1400-1427 MHz, 2690-2700 MHz, exceto aquelas do nº 5.422, 10,68-10,7 GHz, exceto aquelas do nº. 5.483, 15,35-15,4 GHz, exceto aquelas do nº. 5.511, 23,6-24 GHz, 31,3-31,5 GHz, 31,5-31,8 GHz, na Região 2, 48,94-49,04 GHz, de estações aeronáuticas 50,2-50,4 GHz3, 52,6-54,25 GHz, 86-92 GHz, 100-102 GHz, 109,5-111,8 GHz, 114,25-116 GHz, 148,5-151,5 GHz, 164-167 GHz, 182-185 GHz, 190-191,8 GHz, 200-209 GHz, 226-231,5 GHz, 250-252 GHz. (CMR-03)","tier":"itu","text_en":"All emissions are prohibited in the following bands:\n1 400-1 427 MHz, 2 690-2 700 MHz, except those provided for by No. 5.422, 10.68-10.7 GHz, except those provided for by No. 5.483, 15.35-15.4 GHz, except those provided for by No. 5.511, 23.6-24 GHz, 31.3-31.5 GHz, 31.5-31.8 GHz, in Region 2, 48.94-49.04 GHz, from airborne stations 50.2-50.4 GHz1, 52.6-54.25 GHz, 86-92 GHz, 100-102 GHz, 109.5-111.8 GHz, 114.25-116 GHz, 148.5-151.5 GHz, 164-167 GHz, 182-185 GHz, 190-191.8 GHz, 200-209 GHz, 226-231.5 GHz, 250-252 GHz. (WRC-03)"},"5.431A":{"text":"Na Região 2, a atribuição da faixa de frequências de 3400-3500 MHz ao serviço móvel, exceto móvel aeronáutico, em primário, está sujeito a acordo conforme nº 9.21. Regulamento de Rádio (CMR-15)","tier":"itu","text_en":"In Region 2, the allocation of the frequency band 3 400-3 500 MHz to the mobile, except aeronautical mobile, service on a primary basis is subject to agreement obtained under No. 9.21 . (WRC-15)"},"5.431B":{"text":"Na Região 2, a faixa de frequências 3400-3600 MHz é identificada para utilização pelas Administrações que desejam implementar as Telecomunicações Móveis Internacionais (IMT). Esta identificação não exclui a utilização desta faixa de frequências por qualquer aplicação dos serviços aos quais é atribuída e não estabelece prioridade no Regulamento das Radiocomunicações (RR). Na fase de coordenação, aplicam-se também as disposições dos nº 9.17 e nº 9.18.","tier":"itu","text_en":"In Region 2, the frequency band 3 400-3 600 MHz is identified for use by administrations wishing to implement International Mobile Telecommunications (IMT). This identification does not preclude the use of this frequency band by any application of the services to which it is allocated and does not establish priority in the Radio Regulations. At the stage of coordination the provisions of Nos. 9.17 and 9.18 also apply. Before an administration brings into use a base or mobile station of an IMT system, it shall seek agreement under No."},"5.433":{"text":"Na Região 2 e 3, a faixa 3400-3600 MHz o serviço de radiolocalização está atribuído em caráter primário. No entanto, todas as Administrações operando no sistema de radiolocalização nesta faixa são instadas a cessar as operações em 1985. Depois disso, as Administrações deverão tomar todas as medidas necessárias para proteger o serviço fixo por satélite e os requisitos de coordenação não deverão ser impostos ao serviço fixo por satélite.","tier":"itu","text_en":"In Regions 2 and 3, in the band 3 400-3 600 MHz the radiolocation service is allocated on a primary basis. However, all administrations operating radiolocation systems in this band are urged to cease operations by 1985. Thereafter, administrations shall take all practicable steps to protect the fixed-satellite service and coordination requirements shall not be imposed on the fixed-satellite service."},"5.434":{"text":"In Canada, Colombia, Costa Rica and the United States, the frequency band 3 600-3 700 MHz, or portions thereof, is identified for use by these administrations wishing to implement International Mobile Telecommunications (IMT). This identification does not preclude the use of this frequency band by any application of the services to which it is allocated and does not establish priority in the Radio Regulations. At the stage of coordination the provisions of Nos. 9.17 and 9.18 also apply.","tier":"itu"},"5.441":{"text":"O uso das faixas 4500-4800 MHz (espaço para Terra) e 6725-7025 MHz (Terra para espaço) pelo serviço fixo por satélite deverá estar de acordo com as disposições do Apêndice 30B. O uso das faixas 10,7-10,95 GHz (espaço para Terra), 11,2-11,45 GHz (espaço para Terra) e 12,75-13,25 GHz (Terra para espaço) pelos sistemas de satélites geoestacionários do serviço fixo por satélite deverá estar de acordo com as disposições do Apêndice 30B.","tier":"itu","text_en":"The use of the bands 4 500-4 800 MHz (space-to-Earth), 6 725-7 025 MHz (Earth-to-space) by the fixed-satellite service shall be in accordance with the provisions of Appendix 30B. The use of the bands 10.7-10.95 GHz (space-to-Earth), 11.2-11.45 GHz (space-to-Earth) and 12.75-13.25 GHz (Earth-to-space) by geostationary-satellite systems in the fixed-satellite service shall be in accordance with the provisions of Appendix 30B."},"5.457A":{"text":"Nas faixas 5925-6425 MHz e 14-14,5 GHz, estações terrenas a bordo de embarcações podem comunicar com estações espaciais do serviço fixo por satélite. Tal uso deverá estar de acordo com a Resolução 902 (CMR-03). (CMR-03)","tier":"itu","text_en":"In the bands 5 925-6 425 MHz and 14-14.5 GHz, earth stations located on board vessels may communicate with space stations of the fixed-satellite service. Such use shall be in accordance with Resolution 902 (WRC-03). (WRC-03)"},"5.484A":{"text":"O uso das faixas 10,95-11,2 GHz (espaço para Terra), 11,45-11,7 GHz (espaço para Terra), 11,7-12,2 GHz (espaço para Terra) na Região 2, 12,2-12,75 GHz (espaço para Terra) na Região 3, 12,5-12,75 GHz (espaço para Terra) na Região 1, 13,75-14,5 GHz (Terra para espaço), 17,8-18,6 GHz (espaço para Terra), 19,7-20,2 GHz (espaço para Terra), 27,5-28,6 GHz (Terra para espaço) e 29,5-30 GHz (Terra para espaço) por sistemas de satélites não-geoestacionários no serviço Fixo por Satélite está sujeito à aplicação das disposições do nº 9.12 para coordenação com outros sistemas de satélites não-geoestacioná.","tier":"itu","text_en":"The use of the bands 10.95-11.2 GHz (space-to-Earth), 11.45-11.7 GHz (space-to-Earth), 11.7-12.2 GHz (space-to-Earth) in Region 2, 12.2-12.75 GHz (space-to-Earth) in Region 3, 12.5-12.75 GHz (space-to-Earth) in Region 1, 13.75-14.5 GHz (Earth-to-space), 17.8-18.6 GHz (space-to-Earth), 19.7-20.2 GHz (space-to-Earth), 27.5-28.6 GHz (Earth-to-space), 29.5-30 GHz (Earth-to-space) by a non-geostationary-satellite system in the fixed-satellite service is subject to application of the provisions of No."},"5.484B":{"text":"A Resolução 155 é aplicável. (CMR-15)","tier":"itu","text_en":"Resolution 155 (WRC-15) shall apply. (WRC-15)"},"5.485":{"text":"Na Região 2, na faixa 11,7-12,2 GHz, \"transponders\" de estações espaciais do serviço fixo por satélite podem também ser utilizados para transmissões no serviço de radiodifusão por satélite, desde que tais transmissões não tenham uma e.i.r.p. máxima maior que 53 dBW por canal de televisão e não causem maior interferência ou exijam mais proteção contra interferência que as consignações de frequências coordenadas do serviço fixo por satélite. Com relação aos serviços espaciais, esta faixa deve ser utilizada principalmente pelo serviço fixo por satélite.","tier":"itu","text_en":"In Region 2, in the band 11.7-12.2 GHz, transponders on space stations in the fixed-satellite service may be used additionally for transmissions in the broadcasting-satellite service, provided that such transmissions do not have a maximum e.i.r.p. greater than 53 dBW per television channel and do not cause greater interference or require more protection from interference than the coordinated fixed-satellite service frequency assignments. With respect to the space services, this band shall be used principally for the fixed-satellite service."},"5.486":{"text":"Diferente categoria de serviço: no México e nos Estados Unidos, a atribuição da faixa 11,7-12,1 GHz para o serviço fixo é em caráter secundário (veja nº 5.32).","tier":"itu","text_en":"Different category of service: in the United States, the allocation of the frequency band 11.7-12.1 GHz to the fixed service is on a secondary basis (see No. 5.32 ). (WRC-15)"},"5.487A":{"text":"Atribuição adicional: na Região 1, a faixa 11,7-12,5 GHz, na Região 2, a faixa 12,2-12,7 GHz, e na Região 3, a faixa 11,7-12,2 GHz, estão também atribuídas ao serviço fixo por satélite (espaço para Terra) em caráter primário, limitado a sistemas não-geoestacionários e sujeito a aplicação das disposições do nº 9.12 para coordenação com outros sistemas de satélites não-geoestacionários do serviço fixo por satélite.","tier":"itu","text_en":"Additional allocation: in Region 1, the band 11.7-12.5 GHz, in Region 2, the band 12.2-12.7 GHz and, in Region 3, the band 11.7-12.2 GHz, are also allocated to the fixed-satellite service (space-to-Earth) on a primary basis, limited to non-geostationary systems and subject to application of the provisions of No. 9.12 for coordination with other non-geostationary-satellite systems in the fixed-satellite service."},"5.488":{"text":"O uso da faixa 11,7-12,2 GHz por redes de satélites geoestacionários do serviço fixo por satélite na Região 2 está sujeito a aplicação das disposições do nº 9.14 para coordenação com estações dos serviços terrestres das Regiões 1, 2 e 3. Para o uso da faixa 12,2-12,7 GHz pelo serviço de radiodifusão por satélite na Região 2, ver o Apêndice 30. (CMR-03)","tier":"itu","text_en":"The use of the band 11.7-12.2 GHz by geostationary-satellite networks in the fixed-satellite service in Region 2 is subject to application of the provisions of No. 9.14 for coordination with stations of terrestrial services in Regions 1, 2 and 3. For the use of the band 12.2-12.7 GHz by the broadcasting-satellite service in Region 2, see Appendix 30 . (WRC-03)"},"5.489":{"text":"Atribuição adicional: no Peru, a faixa 12,1-12,2 GHz também está atribuída ao serviço fixo em caráter primário.","tier":"itu","text_en":"Additional allocation: in Peru, the band 12.1-12.2 GHz is also allocated to the fixed service on a primary basis."},"5.490":{"text":"Na Região 2, na faixa 12,2-12,7 GHz, os serviços de radiocomunicações terrestres existentes e futuros não deverão causar interferência prejudicial aos serviços espaciais operando de acordo com o Plano de Radiodifusão por Satélite para a Região 2 contido no Apêndice 30.","tier":"itu","text_en":"In Region 2, in the band 12.2-12.7 GHz, existing and future terrestrial radiocommunication services shall not cause harmful interference to the space services operating in conformity with the broadcasting-satellite Plan for Region 2 contained in Appendix 30 ."},"5.492":{"text":"Assignments to stations of the broadcasting-satellite service which are in conformity with the appropriate regional Plan or included in the Regions 1 and 3 List in Appendix 30 may also be used for transmissions in the fixed-satellite service (space-to-Earth), provided that such transmissions do not cause more interference, or require more protection from interference, than the broadcasting-satellite service transmissions operating in conformity with the Plan or the List, as appropriate. (WRC-2000)","tier":"itu"},"5.497":{"text":"O uso da faixa 13,25-13,4 GHz pelo serviço de radionavegação aeronáutica está limitado a auxílios à navegação que empreguem o efeito Doppler.","tier":"itu","text_en":"The use of the band 13.25-13.4 GHz by the aeronautical radionavigation service is limited to Doppler navigation aids."},"5.498A":{"text":"Os serviços de exploração da Terra por satélite (ativo) e pesquisa espacial (ativo) operando na faixa 13,25-13,4 GHz não deverão causar interferência prejudicial ou restringir o uso e desenvolvimento do serviço de radionavegação aeronáutica. (CMR-97)","tier":"itu","text_en":"The Earth exploration-satellite (active) and space research (active) services operating in the band 13.25-13.4 GHz shall not cause harmful interference to, or constrain the use and development of, the aeronautical radionavigation service. (WRC-97)"},"5.499C":{"text":"The allocation of the frequency band 13.4-13.65 GHz to the space research service on a primary basis is limited to: –satellite systems operating in the space research service (space-to-space) to relay data from space stations in the geostationary-satellite orbit to associated space stations in non-geostationary satellite orbits for which advance publication information has been received by the Bureau by 27 November 2015, –active spaceborne sensors, –satellite systems operating in the space research service (space-to-Earth) to relay data from space stations in the geostationary-satellite orbit .","tier":"itu"},"5.499D":{"text":"In the frequency band 13.4-13.65 GHz, satellite systems in the space research service (space-to-Earth) and/or the space research service (space-to-space) shall not cause harmful interference to, nor claim protection from, stations in the fixed, mobile, radiolocation and Earth exploration-satellite (active) services. (WRC-15)","tier":"itu"},"5.501A":{"text":"A atribuição da faixa 13,4-13,75 GHz ao serviço de pesquisa espacial em caráter primário está limitada a sensores espaciais ativos. Outras utilizações da faixa pelo serviço de pesquisa espacial serão em caráter secundário. (CMR-97)","tier":"itu","text_en":"The allocation of the band 13.4-13.75 GHz to the space research service on a primary basis is limited to active spaceborne sensors. Other uses of the band by the space research service are on a secondary basis. (WRC-97)"},"5.501B":{"text":"Na faixa 13,4-13,75 GHz, os serviços de exploração da Terra por satélite (ativo) e pesquisa espacial (ativo) não deverão causar interferência prejudicial nem restringir o uso e desenvolvimento do serviço de radiolocalização. (CMR-07)","tier":"itu","text_en":"In the band 13.4-13.75 GHz, the Earth exploration-satellite (active) and space research (active) services shall not cause harmful interference to, or constrain the use and development of, the radiolocation service. (WRC-97)"},"5.502":{"text":"Na faixa de 13,75-14 GHz, uma estação terrena em uma rede do serviço fixo por satélite geoestacionário deverá ter uma antena de no mínimo 1,2 m de diâmetro e uma estação terrena em um sistema do serviço fixo por satélite não-geoestacionário deverá ter uma antena de no mínimo 4,5 m de diâmetro. Adicionalmente, a e.i.r.p., média em um segundo, radiada por uma estação nos serviços de radiolocalização ou radionavegação não deverá exceder 59 dBW para ângulos de elevação acima de 2º e 65 dBW para ângulos menores.","tier":"itu","text_en":"In the band 13.75-14 GHz, an earth station of a geostationary fixed-satellite service network shall have a minimum antenna diameter of 1.2 m and an earth station of a non-geostationary fixed-satellite service system shall have a minimum antenna diameter of 4.5 m. In addition, the e.i.r.p., averaged over one second, radiated by a station in the radiolocation or radionavigation services shall not exceed 59 dBW for elevation angles above 2° and 65 dBW at lower angles."},"5.503":{"text":"Na faixa 13,75-14 GHz, estações espaciais geoestacionárias do serviço de pesquisa espacial, para as quais o Bureau tenha recebido informação para publicação antecipada antes de 31 de janeiro de 1992, deverão operar em igualdade de condições com estações do serviço fixo por satélite; após esta data, novas estações espaciais geoestacionárias do serviço de pesquisa espacial operarão em caráter secundário.","tier":"itu","text_en":"In the band 13.75 - 14 GHz, geostationary space stations in the space research service for which information for advance publication has been received by the Bureau prior to 31 January 1992 shall operate on an equal basis with stations in the fixed-satellite service; after that date, new geostationary space stations in the space research service will operate on a secondary basis."},"5.504":{"text":"O uso da faixa 14-14,3 GHz pelo serviço de radionavegação deverá ser tal que promova proteção suficiente às estações espaciais do serviço fixo por satélite.","tier":"itu","text_en":"The use of the band 14-14.3 GHz by the radionavigation service shall be such as to provide sufficient protection to space stations of the fixed-satellite service."},"5.504A":{"text":"Na faixa 14-14,5 GHz, estações terrenas a bordo de aeronaves operando no serviço móvel aeronáutico por satélite em caráter secundário podem também comunicar com estações espaciais do serviço fixo por satélite. As disposições nº 5.29, 5.30 e 5.31 se aplicam. (CMR-03)","tier":"itu","text_en":"In the band 14-14.5 GHz, aircraft earth stations in the secondary aeronautical mobile-satellite service may also communicate with space stations in the fixed-satellite service. The provisions of Nos. 5.29, 5.30 and 5.31 apply. (WRC-03)"},"5.506":{"text":"A faixa 14-14,5 GHz pode ser usada, no serviço fixo por satélite (Terra para espaço), para enlaces de alimentação para o serviço de radiodifusão por satélite, sujeito a coordenação com outras redes no serviço fixo por satélite. Tal uso de enlaces de alimentação está reservado para países fora da Europa.","tier":"itu","text_en":"The band 14-14.5 GHz may be used, within the fixed-satellite service (Earth-to-space), for feeder links for the broadcasting-satellite service, subject to coordination with other networks in the fixed-satellite service. Such use of feeder links is reserved for countries outside Europe."},"5.506A":{"text":"Na faixa 14-14,5 GHz, as estações terrenas navais cuja e.i.r.p seja superior a 21 dBW deverão operar segundo as mesmas condições das estações terrenas a bordo de embarcações, como estabelecido na Resolução 902 (CMR-03). Esta nota não se aplica a estações terrenas navais para as quais a informação completa do Apêndice 4 tenha sido recebida pelo Bureau antes de 5 de julho de 2003. (CMR-03)","tier":"itu","text_en":"In the band 14-14.5 GHz, ship earth stations with an e.i.r.p. greater than 21 dBW shall operate under the same conditions as earth stations located on board vessels, as provided in Resolution 902 (WRC-03). This footnote shall not apply to ship earth stations for which the complete Appendix 4 information has been received by the Bureau prior to 5 July 2003. (WRC-03)"},"5.509B":{"text":"O uso das faixas de frequências 14.5-14.75 GHz, nos países listados na Resolução 163 (CMR-15), e 14.5-14.8 GHz, nos países listados na Resolução 164 (CMR-15), pelo serviço fixo por satélite (Terra-espaço), exceto para enlaces de alimentação do serviço de radiodifusão por satélite, é limitado a satélites geoestacionários. (CMR-15)","tier":"itu","text_en":"The use of the frequency bands 14.5-14.75 GHz in countries listed in Resolution 163 (WRC-15) and 14.5-14.8 GHz in countries listed in Resolution 164 (WRC-15) by the fixed-satellite service (Earth-to-space) not for feeder links for the broadcasting-satellite service is limited to geostationary-satellites. (WRC-15)"},"5.509C":{"text":"Para o uso das faixas de frequências 14.5-14.75 GHz, nos países listados na Resolução 163 (CMR-15), e 14.5-14.8 GHz, nos países listados na Resolução 164 (CMR-15), pelo serviço fixo por satélite (Terra-espaço), exceto para enlaces de alimentação do serviço de radiodifusão por satélite, as estações terrenas do serviço fixo por satélite devem ter um diâmetro mínimo de antena de 6 m e uma densidade espectral de potência máxima de -44,5 dBW/Hz na entrada da antena. As estações terrenas devem ser notificadas em localidades conhecidas da terra. (CMR-15)","tier":"itu","text_en":"For the use of the frequency bands 14.5-14.75 GHz in countries listed in Resolution 163 (WRC-15) and 14.5-14.8 GHz in countries listed in Resolution 164 (WRC-15) by the fixed-satellite service (Earth-to-space) not for feeder links for the broadcasting-satellite service, the fixed-satellite service earth stations shall have a minimum antenna diameter of 6 m and a maximum power spectral density of -44.5 dBW/Hz at the input of the antenna. The earth stations shall be notified at known locations on land. (WRC-15)"},"5.509D":{"text":"5.509D - Antes de uma Administração colocar em serviço uma estação terrena no serviço fixo por satélite (Terra-espaço), exceto para enlaces de alimentação do serviço de radiodifusão por satélite nas faixas de frequências 14.5-14.75 GHz (nos países listados na Resolução 163 (CMR-15)) e 14,5-14,8 GHz (nos países listados na Resolução 164 (CMR-15)), deve ser garantida que a densidade de fluxo de potência produzida por esta estação terrena não excederá a -151,5 dB (W/4 kHz)) produzida em todas as altitudes de 0 m a 19.000 m acima do nível do mar a 22 km de toda região costeira, definida como a mar.","tier":"itu","text_en":"Before an administration brings into use an earth station in the fixed-satellite service (Earth-to-space) not for feeder links for the broadcasting-satellite service in the frequency bands 14.5-14.75 GHz (in countries listed in Resolution 163 (WRC-15)) and 14.5-14.8 GHz (in countries listed in Resolution 164 (WRC-15)), it shall ensure that the power flux-density produced by this earth station does not exceed -151.5 dB(W/(m2 · 4 kHz)) produced at all altitudes from 0 m to 19 000 m above sea level at 22 km seaward from all coasts, defined as the low-water mark, as officially recognized by each c."},"5.509E":{"text":"Nas faixas de frequências 14.50-14.75 GHz, nos países listados na Resolução 163 (CMR-15), e 14.50-14.8 GHz, nos países listados na Resolução 164 (CMR-15), a localização das estações terrenas no serviço fixo por satélite (Terra-espaço), exceto para enlaces de alimentação do serviço de radiodifusão por satélite, deve manter uma distância de separação de pelo menos 500 km da(s) fronteira(s) de outros países, a menos que as distâncias mais curtas sejam explicitamente acordadas por essas Administrações. A nº 9.17 não se aplica.","tier":"itu","text_en":"In the frequency bands 14.50-14.75 GHz in countries listed in Resolution 163 (WRC-15) and 14.50-14.8 GHz in countries listed in Resolution 164 (WRC-15), the location of earth stations in the fixed-satellite service (Earth-to-space) not for feeder links for the broadcasting-satellite service shall maintain a separation distance of at least 500 km from the border(s) of other countries unless shorter distances are explicitly agreed by those administrations. No. 9.17 does not apply."},"5.509F":{"text":"Nas faixas de frequências 14.50-14.75 GHz, nos países listados na Resolução 163 (CMR-15), e 14.50-14.8 GHz, nos países listados na Resolução 164 (CMR-15), as estações terrenas do serviço fixo por satélite (terra-espaço), exceto para enlaces de alimentação do serviço de radiodifusão por satélite, não devem restringir a futura implantação dos serviços fixos e móveis. (CMR-15)","tier":"itu","text_en":"In the frequency bands 14.50-14.75 GHz in countries listed in Resolution 163 (WRC-15) and 14.50-14.8 GHz in countries listed in Resolution 164 (WRC-15), earth stations in the fixed-satellite service (Earth-tospace) not for feeder links for the broadcasting-satellite service shall not constrain the future deployment of the fixed and mobile services. (WRC-15)"},"5.509G":{"text":"The frequency band 14.5-14.8 GHz is also allocated to the space research service on a primary basis. However, such use is limited to the satellite systems operating in the space research service (Earth-to-space) to relay data to space stations in the geostationary-satellite orbit from associated earth stations.","tier":"itu"},"5.510":{"text":"O uso da faixa 14,5-14,8 GHz pelo serviço fixo por satélite (Terra para espaço) está limitado a enlaces de alimentação do serviço de radiodifusão por satélite. Esta utilização está reservada para países fora da Europa.","tier":"itu","text_en":"Except for use in accordance with Resolution 163 (WRC-15) and Resolution 164 (WRC-15), the use of the frequency band 14.5-14.8 GHz by the fixed-satellite service (Earth-to-space) is limited to feeder links for the broadcasting-satellite service. This use is reserved for countries outside Europe. Uses other than feeder links for the broadcasting-satellite service are not authorized in Regions 1 and 2 in the frequency band 14.75-14.8 GHz. (WRC-15)"},"5.511A":{"text":"A faixa 15,43-15,63 GHz também está atribuída ao serviço fixo por satélite (espaço para Terra) em caráter primário. O uso da faixa 15,43-15,63 GHz pelo serviço fixo por satélite (espaço para Terra e Terra para espaço) está limitado aos enlaces de alimentação dos sistemas não-geoestacionários do serviço móvel por satélite, sujeito a coordenação conforme nº 9.11A.","tier":"itu","text_en":"The band 15.43-15.63 GHz is also allocated to the fixed-satellite service (space-to-Earth) on a primary basis. Use of the band 15.43-15.63 GHz by the fixed-satellite service (space-to-Earth and Earth-to-space) is limited to feeder links of non-geostationary systems in the mobile-satellite service, subject to coordination under No. 9.11A."},"5.511C":{"text":"Estações operando no serviço de radionavegação aeronáutico devem limitar a e.i.r.p. efetiva de acordo com a Recomendação ITU-R S.1340. A distância mínima de coordenação requerida para proteger as estações de radionavegação aeronáutica (nº 4.10 aplicável) de interferência prejudicial de enlaces de alimentação de estações terrenas e a máxima e.i.r.p. transmitida em relação ao plano horizontal local pelo enlace de alimentação de uma estação terrena deve estar de acordo com a Recomendação ITU-R 1340. (CMR-97)","tier":"itu","text_en":"Stations operating in the aeronautical radionavigation service shall limit the effective e.i.r.p. in accordance with Recommendation ITU-R S.1340. The minimum coordination distance required to protect the aeronautical radionavigation stations (No. 4.10 applies) from harmful interference from feeder-link earth stations and the maximum e.i.r.p. transmitted towards the local horizontal plane by a feeder-link earth station shall be in accordance with Recommendation ITU-R S.1340. (WRC-97)"},"5.511E":{"text":"Na faixa de frequências 15,4-15,7 GHz, estações operando no serviço de radiolocalização não deverão causar interferência nem solicitar proteção a estações operando no serviço de radionavegação aeronáutica. (CMR-12)","tier":"itu","text_en":"In the frequency band 15.4-15.7 GHz, stations operating in the radiolocation service shall not cause harmful interference to, or claim protection from, stations operating in the aeronautical radionavigation service. (WRC12)"},"5.511F":{"text":"Com o objetivo de proteger o serviço de radioastronomia na faixa de frequências 15,35-15,4 GHz, estações de radiolocalização operando na faixa de frequências de 15,4-15,7 GHz não deverão exceder a um de densidade de fluxo de potência de -156 dB(W/m 2nível ) em uma largura de faixa de 50 MHz na faixa de frequências de 15,35-15,4 GHz, em qualquer Observatório de radioastronomia por mais de 2% do tempo. (CMR-12)","tier":"itu","text_en":"In order to protect the radio astronomy service in the frequency band 15.35-15.4 GHz, radiolocation stations operating in the frequency band 15.415.7 GHz shall not exceed the power flux-density level of -156 dB(W/m2) in a 50 MHz bandwidth in the frequency band 15.35-15.4 GHz, at any radio astronomy observatory site for more than 2 per cent of the time. (WRC12)"},"5.512":{"text":"Additional allocation: in Algeria, Saudi Arabia, Austria, Bahrain, Bangladesh, Brunei Darussalam, Cameroon, Congo (Rep. of the), Egypt, El Salvador, the United Arab Emirates, Eritrea, Finland, Guatemala, India, Indonesia, Iran (Islamic Republic of), Jordan, Kenya, Kuwait, Lebanon, Libya, Malaysia, Mali, Morocco, Mauritania, Montenegro, Nepal, Nicaragua, Niger, Oman, Pakistan, Qatar, Syrian Arab Republic, the Dem. Rep.","tier":"itu"},"5.513A":{"text":"Sensores espaciais ativos operando na faixa 17,2-17,3 GHz não deverão causar interferência prejudicial ou restringir o desenvolvimento dos serviços de radiolocalização e outros serviços atribuídos em caráter primário. (CMR-97)","tier":"itu","text_en":"Spaceborne active sensors operating in the band 17.2-17.3 GHz shall not cause harmful interference to, or constrain the development of, the radiolocation and other services allocated on a primary basis. (WRC-97)"},"5.514":{"text":"Additional allocation: in Algeria, Saudi Arabia, Bahrain, Bangladesh, Cameroon, El Salvador, the United Arab Emirates, Guatemala, India, Iran (Islamic Republic of), Iraq, Israel, Italy, Japan, Jordan, Kuwait, Libya, Lithuania, Nepal, Nicaragua, Nigeria, Oman, Uzbekistan, Pakistan, Qatar, Kyrgyzstan, Sudan and South Sudan, the frequency band 17.3-17.7 GHz is also allocated to the fixed and mobile services on a secondary basis. The power limits given in Nos. 21.3 and 21.5 shall apply. (WRC-15)","tier":"itu"},"5.515":{"text":"Na faixa 17,3-17,8 GHz, o compartilhamento entre o serviço fixo por satélite (Terra para espaço) e o serviço de radiodifusão por satélite também deverão estar de acordo com as disposições da § 1 do Anexo 4 do Apêndice 30A.","tier":"itu","text_en":"In the band 17.3-17.8 GHz, sharing between the fixed-satellite service (Earth-to-space) and the broadcasting-satellite service shall also be in accordance with the provisions of § 1 of Annex 4 of Appendix 30A."},"5.516":{"text":"O uso da faixa 17,3-18,1 GHz por sistemas de satélites geoestacionários do serviço fixo por satélite (Terra para espaço) está limitado aos enlaces de alimentação para o serviço de radiodifusão por satélite. A utilização da faixa 17,3-17,8 GHz na Região 2 por sistemas do serviço fixo por satélite (Terra-espaço) está limitada aos satélites geoestacionários. Para o uso da faixa 17,3-17,8 GHz na Região 2 pelos enlaces de alimentação para o serviço de radiodifusão por satélite na faixa 12,2-12,7 GHz, ver Artigo 11.","tier":"itu","text_en":"The use of the band 17.3-18.1 GHz by geostationary-satellite systems in the fixed-satellite service (Earth-to-space) is limited to feeder links for the broadcasting-satellite service. The use of the band 17.3-17.8 GHz in Region 2 by systems in the fixed-satellite service (Earth-to-space) is limited to geostationary satellites. For the use of the band 17.3-17.8 GHz in Region 2 by feeder links for the broadcasting-satellite service in the band 12.2- 12.7 GHz, see Article 11."},"5.517":{"text":"Na Região 2, o uso do serviço fixo por satélite (espaço para Terra) na faixa de 17,7 GHz a 17,8 GHz, não deve causar interferência prejudicial nem solicitar proteção consignações do serviço de radiodifusão por satélite operando em conformidade com o Regulamento de Rádio. (CMR-07)","tier":"itu","text_en":"In Region 2, use of the fixed-satellite (space-to-Earth) service in the band 17.7-17.8 GHz shall not cause harmful interference to nor claim protection from assignments in the broadcasting-satellite service operating in conformity with the Radio Regulations. (WRC-07)"},"5.519":{"text":"Atribuição adicional: as faixas de 18-18,3 GHz, na Região 2, e, de 18,1-18,4 GHz nas Regiões 1 e 3 estão igualmente atribuídas ao serviço de meteorologia por satélite (espaço para Terra) em caráter primário. Seu uso está limitado aos satélites geoestacionários. (CMR-07)","tier":"itu","text_en":"Additional allocation: the bands 18-18.3 GHz in Region 2 and 18.1-18.4 GHz in Regions 1 and 3 are also allocated to the meteorological-satellite service (space-to-Earth) on a primary basis. Their use is limited to geostationary satellites. (WRC-07)"},"B11":{"text":"As estações espaciais do Serviço de Radiodifusão por Satélite em 17,3 GHz a 17,7 GHz também podem ser utilizadas para transmissões (espaço-Terra) para estações de acesso com antenas de diâmetro maior ou igual a 2,5 m, desde que estas transmissões não causem mais interferência do que as transmissões para estações do Serviço de Radiodifusão por Satélite e desde que essas estações de acesso não exijam proteção contra interferência de estações dos demais serviços atribuídos nessa faixa.","tier":"national"}}},"Malaysia":{"iso":"MY","itu_region":3,"plan":"Spectrum Plan","authority":"MCMC (SKMM)","edition":"Issued 2017","language":"English","regional_table":null,"rows":[{"from_mhz":3400.0,"to_mhz":3500.0,"table":"National","primary":[{"service":"FIXED","direction":[]},{"service":"FIXED-SATELLITE","direction":["space-to-Earth"]}],"secondary":[{"service":"Amateur","direction":[]},{"service":"Mobile","direction":[]},{"service":"Radiolocation","direction":[]}],"footnotes":["5.432","5.432B","5.433","5.282","5.432A","MLA88","MLA3","MLA58","MLA89","MLA102"],"applications":null,"national_note":null,"legal_basis":null},{"from_mhz":3500.0,"to_mhz":3600.0,"table":"National","primary":[{"service":"FIXED","direction":[]},{"service":"FIXED-SATELLITE","direction":["space-to-Earth"]},{"service":"MOBILE except aeronautical mobile","direction":[]}],"secondary":[{"service":"Radiolocation","direction":[]}],"footnotes":["5.433A","5.433","MLA3","MLA58","MLA89","MLA102"],"applications":null,"national_note":null,"legal_basis":null},{"from_mhz":3600.0,"to_mhz":3700.0,"table":"National","primary":[{"service":"FIXED","direction":[]},{"service":"FIXED-SATELLITE","direction":["space-to-Earth"]},{"service":"MOBILE except aeronautical mobile","direction":[]}],"secondary":[{"service":"Radiolocation","direction":[]}],"footnotes":["5.435","MLA3","MLA58","MLA89","MLA102"],"applications":null,"national_note":null,"legal_basis":null},{"from_mhz":3700.0,"to_mhz":4200.0,"table":"National","primary":[{"service":"FIXED","direction":[]},{"service":"FIXED-SATELLITE","direction":["space-to-Earth"]},{"service":"MOBILE except aeronautical mobile","direction":[]}],"secondary":[],"footnotes":["MLA3","MLA58","MLA102"],"applications":null,"national_note":null,"legal_basis":null},{"from_mhz":11700.0,"to_mhz":12100.0,"table":"National","prim ":"Radiolocation","direction":[]}],"footnotes":["5.516","5.514"],"applications":null,"national_note":null,"legal_basis":null},{"from_mhz":17700.0,"to_mhz":17800.0,"table":"National","primary":[{"service":"FIXED","direction":[]},{"service":"FIXED-SATELLITE","direction":["space-to-Earth","Earth-to-space"]},{"service":"MOBILE","direction":[]}],"secondary":[],"footnotes":["5.484A","5.516","MLA73","MLA58B"],"applications":null,"national_note":null,"legal_basis":null},{"from_mhz":17800.0,"to_mhz":18100.0,"table":"National","primary":[{"service":"FIXED","direction":[]},{"service":"FIXED-SATELLITE","direction":["space-to-Earth","Earth-to-space"]},{"service":"MOBILE","direction":[]}],"secondary":[],"footnotes":["5.484A","5.516","MLA73","MLA58B"],"applications":null,"national_note":null,"legal_basis":null}],"footnotes":{"5.149":{"text":"In making assignments to stations of other services to which the bands: 13 360-13 410 kHz, 4 950-4 990 MHz, 102-109.5 GHz, 25 550-25 670 kHz, 4 990-5 000 MHz, 111.8-114.25 GHz, 37.5-38.25 MHz, 6 650-6 675.2 MHz, 128.33-128.59 GHz, 73-74.6 MHz in Regions 1 and 3, 10.6-10.68 GHz, 129.23-129.49 GHz, 150.05-153 MHz in Region 1, 14.47-14.5 GHz, 130-134 GHz, 322-328.6 MHz, 22.01-22.21 GHz, 136-148.5 GHz, 406.1-410 MHz, 22.21-22.5 GHz, 151.5-158.5 GHz, 608-614 MHz in Regions 1 and 3, 22.81-22.86 GHz, 168.59-168.93 GHz, 1 330-1 400 MHz, 23.07-23.12 GHz, 171.11-1 … [abridged · ref T2N-5W]","tier":"itu"},"5.282":{"text":"In the bands 435-438 MHz, 1 260-1 270 MHz, 2 400-2 450 MHz, 3 400-3 410 MHz (in Regions 2 and 3 only) and 5 650-5 670 MHz, the amateur-satellite service may operate subject to not causing harmful interference to other services operating in accordance with the Table (see No. 5.43 ). Administrations authorizing such use shall ensure that any harmful interference caused by emissions from a station in the amateur-satellite service is immediately eliminated in accordance with the provisions of No. 25.11 .","tier":"itu"},"5.339":{"text":"The bands 1 370-1 400 MHz, 2 640-2 655 MHz, 4 950-4 990 MHz and 15.20-15.35 GHz are also allocated to the space research (passive) and Earth exploration-satellite (passive) services on a secondary basis.","tier":"itu"},"5.340":{"text":"All emissions are prohibited in the following bands: 1 400-1 427 MHz, 2 690-2 700 MHz, except those provided for by No. 5.422 , 10.68-10.7 GHz, except those provided for by No. 5.483 , 15.35-15.4 GHz, except those provided for by No. 5.511 , 23.6-24 GHz, 31.3-31.5 GHz, 31.5-31.8 GHz, in Region 2, 48.94-49.04 GHz, from airborne stations GHz2, 50.2-50.4 52.6-54.25 GHz, 86-92 GHz, 100-102 GHz, 109.5-111.8 GHz, 114.25-116 GHz, 148.5-151.5 GHz, 164-167 GHz, 182-185 GHz, 190-191.8 GHz, 200-209 GHz, 226-231.5 GHz, 250-252 GHz. (WRC-03)","tier":"itu"},"5.432":{"text":"Different category of service: in Korea (Rep. of), Japan and Pakistan, the allocation of the band 3 400-3 500 MHz to the mobile, except aeronautical mobile, service is on a primary basis (see No. 5.33 ). (WRC-2000)","tier":"itu"},"5.432A":{"text":"In Korea (Rep. of), Japan and Pakistan, the band 3 400-3 500 MHz is identified for International Mobile Telecommunications (IMT). This identification does not preclude the use of this band by any application of the services to which it is allocated and does not establish priority in the Radio Regulations. At the stage of coordination the provisions of Nos. 9.17 and 9.18 also apply.","tier":"itu"},"5.432B":{"text":"Different category of service: in Australia, Bangladesh, China, French overseas communities of Region 3, India, Iran (Islamic Republic of), New Zealand, the Philippines and Singapore, the frequency band 3 400-3 500 MHz is allocated to the mobile, except aeronautical mobile, service on a primary basis, subject to agreement obtained under No. 9.21 with other administrations and is identified for International Mobile Telecommunications (IMT).","tier":"itu"},"5.433":{"text":"In Regions 2 and 3, in the band 3 400-3 600 MHz the radiolocation service is allocated on a primary basis. However, all administrations operating radiolocation systems in this band are urged to cease operations by 1985. Thereafter, administrations shall take all practicable steps to protect the fixed-satellite service and coordination requirements shall not be imposed on the fixed-satellite service.","tier":"itu"},"5.433A":{"text":"In Australia, Bangladesh, China, French overseas communities of Region 3, Korea (Rep. of), India, Iran (Islamic Republic of), Japan, New Zealand, Pakistan and the Philippines, the frequency band 3 500-3 600 MHz is identified for International Mobile Telecommunications (IMT). This identification does not preclude the use of this frequency band by any application of the services to which it is allocated and does not establish priority in the Radio Regulations. At the stage of coordination the provisions of Nos. 9.17 and 9.18 also apply.","tier":"itu"},"5.435":{"text":"In Japan, in the band 3 620-3 700 MHz, the radiolocation service is excluded.","tier":"itu"},"5.441":{"text":"The use of the bands 4 500-4 800 MHz (space-to-Earth), 6 725-7 025 MHz (Earth-to-space) by the fixed-satellite service shall be in accordance with the provisions of Appendix 30B . The use of the bands 10.7-10.95 GHz (space-to-Earth), 11.2-11.45 GHz (space-to-Earth) and 12.75-13.25 GHz (Earth-to-space) by geostationary-satellite systems in the fixed-satellite service shall be in accordance with the provisions of Appendix 30B .","tier":"itu"},"5.457A":{"text":"In the frequency bands 5 925-6 425 MHz and 14-14.5 GHz, earth stations located on board vessels may communicate with space stations of the fixed-satellite service. Such use shall be in accordance with Resolution 902 (WRC-03) . In the frequency band 5 925-6 425 MHz, earth stations located on board vessels and communicating with space stations of the fixed-satellite service may employ transmit antennas with minimum diameter of 1.2 m and operate without prior agreement of any administration if located at least 330 km away from the low-water mark as officially recognized by the coastal State.","tier":"itu"},"5.457B":{"text":"In the frequency bands 5 925-6 425 MHz and 14-14.5 GHz, earth stations located on board vessels may operate with the characteristics and under the conditions contained in Resolution 902 (WRC-03) in Algeria, Saudi Arabia, Bahrain, Comoros, Djibouti, Egypt, United Arab Emirates, Jordan, Kuwait, Libya, Morocco, Mauritania, Oman, Qatar, the Syrian Arab Republic, Sudan, Tunisia and Yemen, in the maritime mobile-satellite service on a secondary basis. Such use shall be in accordance with Resolution 902 (WRC-03) . (WRC-15)","tier":"itu"},"5.484A":{"text":"The use of the bands 10.95-11.2 GHz (space-to-Earth), 11.45-11.7 GHz (space-to-Earth), 11.7-12.2 GHz (space-to-Earth) in Region 2, 12.2-12.75 GHz (space-to-Earth) in Region 3, 12.5-12.75 GHz (space-to- Earth) in Region 1, 13.75-14.5 GHz (Earth-to-space), 17.8-18.6 GHz (space-to-Earth), 19.7-20.2 GHz (space-to- Earth), 27.5-28.6 GHz (Earth-to-space), 29.5-30 GHz (Earth-to-space) by a non-geostationary-satellite system in the fixed-satellite service is subject to application of the provisions of No.","tier":"itu"},"5.484B":{"text":"Resolution 155 (WRC-15) shall apply. (WRC-15)","tier":"itu"},"5.487":{"text":"In the band 11.7-12.5 GHz in Regions 1 and 3, the fixed, fixed-satellite, mobile, except aeronautical mobile, and broadcasting services, in accordance with their respective allocations, shall not cause harmful interference to, or claim protection from, broadcasting-satellite stations operating in accordance with the Regions 1 and 3 Plan in Appendix 30 . (WRC-03)","tier":"itu"},"5.487A":{"text":"Additional allocation: in Region 1, the band 11.7-12.5 GHz, in Region 2, the band 12.2-12.7 GHz and, in Region 3, the band 11.7-12.2 GHz, are also allocated to the fixed-satellite service (space-to-Earth) on a primary basis, limited to non-geostationary systems and subject to application of the provisions of No. 9.12 for coordination with other non-geostationary-satellite systems in the fixed-satellite service.","tier":"itu"},"5.492":{"text":"Assignments to stations of the broadcasting-satellite service which are in conformity with the appropriate regional Plan or included in the Regions 1 and 3 List in Appendix 30 may also be used for transmissions in the fixed-satellite service (space-to-Earth), provided that such transmissions do not cause more interference, or require more protection from interference, than the broadcasting-satellite service transmissions operating in conformity with the Plan or the List, as appropriate. (WRC-2000)","tier":"itu"},"5.493":{"text":"The broadcasting-satellite service in the band 12.5-12.75 GHz in Region 3 is limited to a power flux-density not exceeding – 111 dB(W/(m 2  27 MHz)) for all conditions and for all methods of modulation at the edge of the service area. (WRC-97)","tier":"itu"},"5.497":{"text":"The use of the band 13.25-13.4 GHz by the aeronautical radionavigation service is limited to Doppler navigation aids.","tier":"itu"},"5.498A":{"text":"The Earth exploration-satellite (active) and space research (active) services operating in the band 13.25-13.4 GHz shall not cause harmful interference to, or constrain the use and development of, the aeronautical radionavigation service. (WRC-97)","tier":"itu"},"5.499":{"text":"Additional allocation: in Bangladesh and India, the band 13.25-14 GHz is also allocated to the fixed service on a primary basis. In Pakistan, the band 13.25-13.75 GHz is allocated to the fixed service on a primary basis. (WRC-12)","tier":"itu"},"5.499C":{"text":"The allocation of the frequency band 13.4-13.65 GHz to the space research service on a primary basis is limited to: - satellite systems operating in the space research service (space-to-space) to relay data from space stations in the geostationary-satellite orbit to associated space stations in non-geostationary satellite orbits for which advance publication information has been received by the Bureau by 27 November 2015, - active spaceborne sensors, - satellite systems operating in the space research service (space-to-Earth) to relay data from space stations in the geostationary-satellite orb.","tier":"itu"},"5.499D":{"text":"In the frequency band 13.4-13.65 GHz, satellite systems in the space research service (space-to-Earth) and/or the space research service (space-to-space) shall not cause harmful interference to, nor claim protection from, stations in the fixed, mobile, radiolocation and Earth exploration-satellite (active) services. (WRC-15)","tier":"itu"},"5.500":{"text":"Additional allocation: in Algeria, Saudi Arabia, Bahrain, Brunei Darussalam, Cameroon, Egypt, the United Arab Emirates, Gabon, Indonesia, Iran (Islamic Republic of), Iraq, Israel, Jordan, Kuwait, Lebanon, Madagascar, Malaysia, Mali, Morocco, Mauritania, Niger, Nigeria, Oman, Qatar, the Syrian Arab Republic, Singapore, Sudan, South Sudan, Chad and Tunisia, the frequency band 13.4-14 GHz is also allocated to the fixed and mobile services on a primary basis. In Pakistan, the frequency band 13.4-13.75 GHz is also allocated to the fixed and mobile services on a primary basis. (WRC-15)","tier":"itu"},"5.501":{"text":"Additional allocation: in Azerbaijan, Hungary, Japan, Kyrgyzstan, Romania and Turkmenistan, the band 13.4-14 GHz is also allocated to the radionavigation service on a primary basis. (WRC-12)","tier":"itu"},"5.501A":{"text":"The allocation of the frequency band 13.65-13.75 GHz to the space research service on a primary basis is limited to active spaceborne sensors. Other uses of the frequency band by the space research service are on a secondary basis. (WRC-15)","tier":"itu"},"5.501B":{"text":"In the band 13.4-13.75 GHz, the Earth exploration-satellite (active) and space research (active) services shall not cause harmful interference to, or constrain the use and development of, the radiolocation service. (WRC-97)","tier":"itu"},"5.502":{"text":"In the band 13.75-14 GHz, an earth station of a geostationary fixed-satellite service network shall have a minimum antenna diameter of 1.2 m and an earth station of a non-geostationary fixed-satellite service system shall have a minimum antenna diameter of 4.5 m. In addition, the e.i.r.p., averaged over one second, radiated by a station in the radiolocation or radionavigation services shall not exceed 59 dBW for elevation angles above 2° and 65 dBW at lower angles.","tier":"itu"},"5.503":{"text":"In the band 13.75-14 GHz, geostationary space stations in the space research service for which information for advance publication has been received by the Bureau prior to 31 January 1992 shall operate on an equal basis with stations in the fixed-satellite service; after that date, new geostationary space stations in the space research service will operate on a secondary basis.","tier":"itu"},"5.504":{"text":"The use of the band 14-14.3 GHz by the radionavigation service shall be such as to provide sufficient protection to space stations of the fixed-satellite service.","tier":"itu"},"5.504A":{"text":"In the band 14-14.5 GHz, aircraft earth stations in the secondary aeronautical mobile-satellite service may also communicate with space stations in the fixed-satellite service. The provisions of Nos. 5.29 , 5.30 and 5.31 apply. (WRC-03)","tier":"itu"},"5.504B":{"text":"Aircraft earth stations operating in the aeronautical mobile-satellite service in the frequency band 14-14.5 GHz shall comply with the provisions of Annex 1, Part C of Recommendation ITU-R M.1643-0, with respect to any radio astronomy station performing observations in the 14.47-14.5 GHz frequency band located on the territory of Spain, France, India, Italy, the United Kingdom and South Africa. (WRC-15)","tier":"itu"},"5.504C":{"text":"In the frequency band 14-14.25 GHz, the power flux-density produced on the territory of the countries of Saudi Arabia, Bahrain, Botswan a, Côte d’Ivoire, Egypt, Guinea, India, Iran (Islamic Republic of), Kuwait, Nigeria, Oman, the Syrian Arab Republic and Tunisia by any aircraft earth station in the aeronautical mobile-satellite service shall not exceed the limits given in Annex 1, Part B of Recommendation ITU-R M.1643-0, unless otherwise specifically agreed by the affected administration(s).","tier":"itu"},"5.505":{"text":"Additional allocation: in Algeria, Saudi Arabia, Bahrain, Botswana, Brunei Darussalam, Cameroon, China, Congo (Rep. of the), Korea (Rep. of), Djibouti, Egypt, the United Arab Emirates, Gabon, Guinea, India, Indonesia, Iran (Islamic Republic of), Iraq, Israel, Japan, Jordan, Kuwait, Lebanon, Malaysia, Mali, Morocco, Mauritania, Oman, the Philippines, Qatar, the Syrian Arab Republic, the Dem. People’s Rep. of Korea, Singapore, Somalia, Sudan, South Sudan, Swaziland, Chad, Viet Nam and Yemen, the frequency band 14-14.3 GHz is also allocated to the fixed service on a primary basis. (WRC-15)","tier":"itu"},"5.506":{"text":"The band 14-14.5 GHz may be used, within the fixed-satellite service (Earth-to-space), for feeder links for the broadcasting-satellite service, subject to coordination with other networks in the fixed-satellite service. Such use of feeder links is reserved for countries outside Europe.","tier":"itu"},"5.506A":{"text":"In the band 14-14.5 GHz, ship earth stations with an e.i.r.p. greater than 21 dBW shall operate under the same conditions as earth stations located on board vessels, as provided in Resolution 902 (WRC-03) . This footnote shall not apply to ship earth stations for which the complete Appendix 4 information has been received by the Bureau prior to 5 July 2003. (WRC-03)","tier":"itu"},"5.506B":{"text":"Earth stations located on board vessels communicating with space stations in the fixed-satellite service may operate in the frequency band 14-14.5 GHz without the need for prior agreement from Cyprus and Malta, within the minimum distance given in Resolution 902 (WRC-03) from these countries. (WRC-15)","tier":"itu"},"5.508":{"text":"Additional allocation: in Germany, France, Italy, Libya, The Former Yugoslav Rep. of Macedonia and the United Kingdom, the band 14.25-14.3 GHz is also allocated to the fixed service on a primary basis. (WRC-12)","tier":"itu"},"5.508A":{"text":"In the frequency band 14.25-14.3 GHz, the power flux-density produced on the territory of the countries of Saudi Arabia, Bahrain, Botswana, China, Côte d’Ivoire, Egypt, France, Guinea, India, Iran (Islamic Republic of), Italy, Kuwait, Nigeria, Oman, the Syrian Arab Republic, the United Kingdom and Tunisia by any aircraft earth station in the aeronautical mobile-satellite service shall not exceed the limits given in Annex 1, Part B of Recommendation ITU-R M.1643-0, unless otherwise specifically agreed by the affected administration(s).","tier":"itu"},"5.509A":{"text":"In the frequency band 14.3-14.5 GHz, the power flux-density produced on the territory of the countries of Saudi Arabia, Bahrain, Botswana, Cameroon, China, Côte d’Ivoire, Egypt, France, Ga bon, Guinea, India, Iran (Islamic Republic of), Italy, Kuwait, Morocco, Nigeria, Oman, the Syrian Arab Republic, the United Kingdom, Sri Lanka, Tunisia and Viet Nam by any aircraft earth station in the aeronautical mobile-satellite service shall not exceed the limits given in Annex 1, Part B of Recommendation ITU-R M.1643-0, unless otherwise specifically agreed by the affected administration(s).","tier":"itu"},"5.509B":{"text":"The use of the frequency bands 14.5-14.75 GHz in countries listed in Resolution 163 (WRC-15) and 14.5-14.8 GHz in countries listed in Resolution 164 (WRC-15) by the fixed-satellite service (Earth-to-space) not for feeder links for the broadcasting-satellite service is limited to geostationary-satellites. (WRC-15)","tier":"itu"},"5.509C":{"text":"For the use of the frequency bands 14.5-14.75 GHz in countries listed in Resolution 163 (WRC-15) and 14.5-14.8 GHz in countries listed in Resolution 164 (WRC-15) by the fixed-satellite service (Earth-to-space) not for feeder links for the broadcasting-satellite service, the fixed-satellite service earth stations shall have a minimum antenna diameter of 6 m a nd a maximum power spectral density of −44.5 dBW/Hz at the input of the antenna. The earth stations shall be notified at known locations on land. (WRC-15)","tier":"itu"},"5.509D":{"text":"Before an administration brings into use an earth station in the fixed-satellite service (Earth-to-space) not for feeder links for the broadcasting-satellite service in the frequency bands 14.5-14.75 GHz (in countries listed in Resolution 163 (WRC-15) ) and 14.5-14.8 GHz (in countries listed in Resolution 164 (WRC-15) ), it shall ensure that the power flux- density produced by this earth station does not exceed −151.5 dB(W/(m2 · 4 kHz)) produced at all altitudes from 0 m to 19 000 m above sea level at 22 km seaward from all coasts, defined as the low-water mark, as officially recognized by eac.","tier":"itu"},"5.509E":{"text":"In the frequency bands 14.50-14.75 GHz in countries listed in Resolution 163 (WRC-15) and 14.50-14.8 GHz in countries listed in Resolution 164 (WRC-15) , the location of earth stations in the fixed-satellite service (Earth-to-space) not for feeder links for the broadcasting-satellite service shall maintain a separation distance of at least 500 km from the border(s) of other countries unless shorter distances are explicitly agreed by those administrations. No. 9.17 does not apply.","tier":"itu"},"5.509F":{"text":"In the frequency bands 14.50-14.75 GHz in countries listed in Resolution 163 (WRC-15) and 14.50-14.8 GHz in countries listed in Resolution 164 (WRC-15) , earth stations in the fixed-satellite service (Earth-to-space) not for feeder links for the broadcasting-satellite service shall not constrain the future deployment of the fixed and mobile services. (WRC-15)","tier":"itu"},"5.509G":{"text":"The frequency band 14.5-14.8 GHz is also allocated to the space research service on a primary basis. However, such use is limited to the satellite systems operating in the space research service (Earth-to-space) to relay data to space stations in the geostationary-satellite orbit from associated earth stations.","tier":"itu"},"5.510":{"text":"Except for use in accordance with Resolution 163 (WRC-15) and Resolution 164 (WRC-15) , the use of the frequency band 14.5-14.8 GHz by the fixed-satellite service (Earth-to-space) is limited to feeder links for the broadcasting-satellite service. This use is reserved for countries outside Europe. Uses other than feeder links for the broadcasting-satellite service are not authorized in Regions 1 and 2 in the frequency band 14.75-14.8 GHz. (WRC-15)","tier":"itu"},"5.511":{"text":"Additional allocation: in Saudi Arabia, Bahrain, Cameroon, Egypt, the United Arab Emirates, Guinea, Iran (Islamic Republic of), Iraq, Israel, Kuwait, Lebanon, Oman, Pakistan, Qatar, the Syrian Arab Republic and Somalia, the band 15.35-15.4 GHz is also allocated to the fixed and mobile services on a secondary basis. (WRC-12)","tier":"itu"},"5.511A":{"text":"Use of the frequency band 15.43-15.63 GHz by the fixed-satellite service (Earth-to-space) is limited to feeder links of non-geostationary systems in the mobile-satellite service, subject to coordination under No. 9.11A . (WRC-15)","tier":"itu"},"5.511C":{"text":"Stations operating in the aeronautical radionavigation service shall limit the effective e.i.r.p. in accordance with Recommendation ITU-R S.1340-0. The minimum coordination distance required to protect the aeronautical radionavigation stations (No. 4.10 applies) from harmful interference from feeder-link earth stations and the maximum e.i.r.p. transmitted towards the local horizontal plane by a feeder-link earth station shall be in accordance with Recommendation ITU-R S.1340-0. (WRC-15)","tier":"itu"},"5.511E":{"text":"In the frequency band 15.4-15.7 GHz, stations operating in the radiolocation service shall not cause harmful interference to, or claim protection from, stations operating in the aeronautical radionavigation service. (WRC-12)","tier":"itu"},"5.511F":{"text":"In order to protect the radio astronomy service in the frequency band 15.35-15.4 GHz, radiolocation stations operating in the frequency band 15.4-15.7 GHz shall not exceed the power flux-density level of −156 dB(W/m 2 ) in a 50 MHz bandwidth in the frequency band 15.35-15.4 GHz, at any radio astronomy observatory site for more than 2 per cent of the time. (WRC-12)","tier":"itu"},"5.512":{"text":"Additional allocation: in Algeria, Saudi Arabia, Austria, Bahrain, Bangladesh, Brunei Darussalam, Cameroon, Congo (Rep. of the), Egypt, El Salvador, the United Arab Emirates, Eritrea, Finland, Guatemala, India, Indonesia, Iran (Islamic Republic of), Jordan, Kenya, Kuwait, Lebanon, Libya, Malaysia, Mali, Morocco, Mauritania, Montenegro, Nepal, Nicaragua, Niger, Oman, Pakistan, Qatar, Syrian Arab Republic, the Dem. Rep.","tier":"itu"},"5.513":{"text":"Additional allocation: in Israel, the band 15.7-17.3 GHz is also allocated to the fixed and mobile services on a primary basis. These services shall not claim protection from or cause harmful interference to services operating in accordance with the Table in countries other than those included in No. 5.512 .","tier":"itu"},"5.513A":{"text":"Spaceborne active sensors operating in the band 17.2-17.3 GHz shall not cause harmful interference to, or constrain the development of, the radiolocation and other services allocated on a primary basis. (WRC-97)","tier":"itu"},"5.514":{"text":"Additional allocation: in Algeria, Saudi Arabia, Bahrain, Bangladesh, Cameroon, El Salvador, the United Arab Emirates, Guatemala, India, Iran (Islamic Republic of), Iraq, Israel, Italy, Japan, Jordan, Kuwait, Libya, Lithuania, Nepal, Nicaragua, Nigeria, Oman, Uzbekistan, Pakistan, Qatar, Kyrgyzstan, Sudan and South Sudan, the frequency band 17.3-17.7 GHz is also allocated to the fixed and mobile services on a secondary basis. The power limits given in Nos. 21.3 and 21.5 shall apply. (WRC-15)","tier":"itu"},"5.516":{"text":"The use of the band 17.3-18.1 GHz by geostationary-satellite systems in the fixed-satellite service (Earth-to-space) is limited to feeder links for the broadcasting-satellite service. The use of the band 17.3-17.8 GHz in Region 2 by systems in the fixed-satellite service (Earth-to-space) is limited to geostationary satellites. For the use of the band 17.3-17.8 GHz in Region 2 by feeder links for the broadcasting-satellite service in the band 12.2-12.7 GHz, see Article 11 .","tier":"itu"},"MLA100":{"text":"Standard Radio System Plan 547: Requirements for Fixed Wireless Access (FWA) Systems Operating in the Frequency Bands from 13.75 GHz to 14.40 GHz and 15.70 GHz to 16.60 GHz.","tier":"national"},"MLA102":{"text":"Standard Radio System Plan 549: Requirements for Devices using Ultra- Wideband (UWB) Technology Operating in the Frequency Bands from 30 MHz to 960 MHz, 2.17 GHz to 10.6 GHz, 21.65 GHz to 29.5 GHz and 77 GHz to 81 GHz.","tier":"national"},"MLA3":{"text":"Class Assignment.","tier":"national"},"MLA58":{"text":"Priority to satellite network filed under the administration of Malaysia at 91.5° East orbital slot in the Fixed Satellite Service.","tier":"national"},"MLA58A":{"text":"Priority to satellite network filed under the administration of Malaysia at 91.5° East orbital slot in the Fixed Satellite Service. Fixed Service stations may operate on a non-interference basis.","tier":"national"},"MLA58B":{"text":"Priority to Fixed Satellite Service, Earth Exploration Satellite Service and Meteorological Satellite Service at designated hub stations only.","tier":"national"},"MLA70":{"text":"Standard Radio System Plan FS 12.75: Requirements for Fixed Wireless Systems Operating in the Frequency Band 12.75 GHz to 13.25 GHz.","tier":"national"},"MLA72":{"text":"Standard Radio System Plan 526: Requirements for Fixed Service Line-Of-Sight Radio-Relay Systems Operating in the Frequency Band from 14.40 GHz to 15.35 GHz.","tier":"national"},"MLA73":{"text":"Standard Radio System Plan 527: Requirements for Fixed Service Line-Of-Sight Radio-Relay Systems Operating in the Frequency Band from 17.70 GHz to 19.70 GHz.","tier":"national"},"MLA88":{"text":"Technical Specification for Amateur Radio Equipment (SKMM WTS ARE).","tier":"national"},"MLA89":{"text":"Technical Specification for Broadband Wireless Access (SKMM WTS BWA).","tier":"national"},"MLA96":{"text":"Specification for Direct-To-Home Satellite Broadcast Receiving Antenna (SKMM MTSFB TC T005).","tier":"national"},"MLA97":{"text":"Specification for Direct-To-Home Satellite Broadcast Receiver (SKMM MTSFB TC T006).","tier":"national"}}}}};

ecraft. Includes inter-satellite links (ISLs), satellite crosslinks and space-to-space data relay.","terms":["inter-satellite links","ISLs","satellite crosslinks","space-to-space data relay","ISL","crosslink","inter-satellite link"]},"SPACE OPERATION":{"desc":"Used to operate and control spacecraft. Includes tracking, telemetry and command (TT&C), spacecraft monitoring, satellite control and launch/early-orbit mission links.","terms":["command","TT&C","launch","early-orbit mission links","telemetry tracking and command","satellite control"]},"BROADCASTING":{"desc":"Used to transmit radio or television programs for direct reception by the public from terrestrial transmitters. Includes AM/FM radio, DAB/DAB+, DRM and terrestrial television such as DVB-T/T2 and ATSC.","terms":["FM radio","DAB","DAB+","DRM","ATSC","DVB-T","terrestrial TV"]},"BROADCASTING-SATELLITE":{"desc":"Used to broadcast radio or television directly to the public by satellite. Includes direct-to-home (DTH) and direct-broadcast satellite (DBS) television and satellite radio.","terms":["direct-to-home","DTH","direct-broadcast satellite (DBS) television","direct-to-home TV","DBS","satellite TV"]},"RADIODETERMINATION":{"desc":"Used to determine the position, distance, direction, speed or movement of an object by radio. It is the umbrella category covering radionavigation and radiolocation and includes ranging, tracking and direction finding.","terms":["direction finding"]},"RADIODETERMINATION-SATELLITE":{"desc":"Used for radiodetermination when one or more space stations are involved. Includes satellite-assisted ranging, positioning and tracking and acts as the umbrella category for satellite radionavigation and radiolocation.","terms":["satellite-assisted ranging","radiolocation","satellite ranging"]},"RADIONAVIGATION":{"desc":"Used for radio-based navigation where the information is needed for safe movement. Includes navigation aids, radio beacons, ranging systems and navigation radar.","terms":["navig "desc":"Used for non-navigation radiolocation involving one or more space stations. Includes satellite-assisted locating, ranging and tracking of objects where the purpose is not navigation.","terms":["satellite-assisted locating","satellite radar tracking"]},"SAFETY":{"desc":"Used for radio communications that protect human life or property. Includes distress and emergency communications, search-and-rescue radio, warning/alert systems and other safety-of-life communications.","terms":["distress","search-and-rescue radio","alert systems","search and rescue","SAR communications"]},"METEOROLOGICAL AIDS":{"desc":"Used to collect and transmit meteorological or hydrological observations. Includes radiosondes/rawinsondes, weather balloons, dropsondes, upper-air sounding and weather/water sensor telemetry.","terms":["radiosondes","rawinsondes","radiosonde","weather balloon"]},"EARTH EXPLORATION-SATELLITE":{"desc":"Used to observe and measure the Earth from satellites. Includes remote sensing, satellite imagery, synthetic-aperture radar (SAR), radar altimetry, scatterometry, microwave/radiometric sensing and environmental, climate, land, ocean and ice monitoring.","terms":["SAR","EESS","remote sensing","SAR imaging","Earth observation"]},"METEOROLOGICAL-SATELLITE":{"desc":"Used specifically for meteorological observations and weather-data distribution by satellite. Includes weather satellites, cloud/weather imagery, atmospheric measurements and climate/meteorological monitoring.","terms":["weather satellites","weather imagery","meteorological monitoring","weather satellite"]},"SPACE RESEARCH":{"desc":"Used for scientific or technological research involving spacecraft. Includes deep-space, lunar and planetary mission communications, scientific probes, space-science telemetry/data and technology-demonstration missions.","terms":["deep-space","deep space","scientific mission"]},"RADIO ASTRONOMY":{"desc":"Used for passive scientific observation of naturally occurring radio emissions from space. Includes radio telescopes, radio observatories, astronomical spectrum observations and very-long-baseline interferometry (VLBI).","terms":["radio telescopes","VLBI","radio telescope"]},"STANDARD FREQUENCY AND TIME SIGNAL":{"desc":"Used to transmit highly accurate reference frequency and time signals by terrestrial radio. Includes radio time broadcasts, precision frequency references, clock synchronization and calibration services.","terms":["time signal"]},"STANDARD FREQUENCY AND TIME SIGNAL-SATELLITE":{"desc":"Used to transmit highly accurate reference frequency and time signals by satellite. Includes satellite time/frequency transfer, precision clock synchronization and dedicated satellite reference signals.","terms":["satellite time","frequency transfer","precision clock synchronization","dedicated satellite reference signals","satellite timing","time transfer"]},"AMATEUR":{"desc":"Used by licensed radio amateurs for non-commercial self-training, experimentation and communications. Includes ham radio, amateur repeaters and emergency communications.","terms":["ham radio","amateur repeaters"]},"AMATEUR-SATELLITE":{"desc":"Used for amateur/ham radio communications through satellites. Includes amateur satellite repeaters/transponders, OSCAR-type satellites and amateur/CubeSat radio links.","terms":["amateur satellite repeaters","transponders","OSCAR-type satellites","amateur","CubeSat radio links","ham satellite","OSCAR"]},"SPECIAL":{"desc":"Used for special-purpose radiocommunications serving a specific public-interest or operational need that does not fall within another defined ITU service and is not open to public correspondence.","terms":[]}};

<script>
/* ---------- constants ---------- */
const BANDS=[
 {key:'S',lo:2000,hi:4000},{key:'C',lo:4000,hi:8000},{key:'X',lo:8000,hi:12000},
 {key:'Ku',lo:12000,hi:18000},{key:'K',lo:18000,hi:27000},{key:'Ka',lo:27000,hi:40000}
];
const WINDOW=DATA.about.band_window_mhz; // [3400, 18000]
let AGE_THRESHOLD_MONTHS=36;
const VERIFICATION={}; // per-jurisdiction override for review states: {status:'machine'|'human', verified_on:'YYYY-MM-DD', by:'name'}
const SAMPLE_USER={name:'Maarit Kask',org:'Sample satellite operator',role:'Regulatory affairs manager',email:'m.kask@example.com'};
const JUR=DATA.jurisdictions;
const HELD=Object.keys(JUR).sort();

/* ---------- state (memory only) ---------- */
const S={user:null,deviceRecognised:false,query:null,result:null,saved:[],expanded:new Set(),legendOpen:null,signin:null,notifyDone:false,viewingSaved:null,openBands:new Set()};

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMHz=v=>{const n=Number(v);const s=Number.isInteger(n)?n.toLocaleString('en-GB'):n.toLocaleString('en-GB',{maximumFractionDigits:3});return s};
const fmtGHz=v=>(Number(v)/1000).toLocaleString('en-GB',{maximumFractionDigits:4})+' GHz';
const rangeLabel=(a,b)=>`${fmtMHz(a)}–${fmtMHz(b)} MHz`;
const titleCase=s=>{let t=s.toLowerCase();t=t.charAt(0).toUpperCase()+t.slice(1);return t.replace(/\((r)\)/g,'(R)')};
const svcKey=s=>s.toUpperCase().replace(/\s+/g,' ').trim();
const dirClass=d=>d==='Earth-to-space'?'up':d==='space-to-space'?'ss':'';
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,5500)}

/* services list from data */
const SERVICES=(()=>{const m=new Map();for(const j of Object.values(JUR))for(const r of j.rows)for(const s of [...r.primary,...r.secondary]){const k=svcKey(s.service);if(!m.has(k)){const base=k.replace(/\s*\(.*$/,'').replace(/\s+EXCEPT .*$/,'').trim();const v=VERN[base]||VERN[k];const plain=!/\(/.test(k)||/\((R|OR)\)$/.test(k);m.set(k,{key:k,label:titleCase(k),aliases:(v&&plain)?[...v.terms].sort((x,y)=>x.length-y.length):[],desc:v?v.desc:''})}}return [...m.values()].sort((a,b)=>a.label.localeCompare(b.label))})();

/* rows get ids */
Object.entries(JUR).forEach(([name,j])=>j.rows.forEach((r,i)=>{r.id=name+':'+i;r.jur=name}));

/* ---------- frequency parsing ---------- */
function parseNum(v){let n=(v||'').trim().replace(/\s/g,'');if(!n)return null;if(n.includes(',')&&!n.includes('.')){n=/,\d{3}(,|$)/.test(n)?n.replace(/,/g,''):n.replace(',','.')}else n=n.replace(/,/g,'');const x=parseFloat(n);return isFinite(x)?x:NaN}
function buildFreq(band,from,to,unit){
  const b=BANDS.find(x=>x.key===band);
  const mult={khz:1e-3,mhz:1,ghz:1e3}[unit]||1;
  const f=parseNum(from),t=parseNum(to);
  if(f===null&&t===null){ if(b) return {lo:b.lo,hi:b.hi,label:`${b.key} band, ${b.lo/1000}\u2013${b.hi/1000} GHz`,band:b.key}; return null }
  if(Number.isNaN(f)||Number.isNaN(t)) return {error:'From and To must be numbers.'};
  let lo=(f??t)*mult,hi=(t??f)*mult;
  if(hi<lo)[lo,hi]=[hi,lo];
  const point=lo===hi;
  const u={khz:'kHz',mhz:'MHz',ghz:'GHz'}[unit];
  const show=v=>(v/mult).toLocaleString('en-GB',{maximumFractionDigits:6});
  const isBand=b&&b.lo===lo&&b.hi===hi;
  return {lo,hi,point,label:isBand?`${b.key} band, ${b.lo/1000}\u2013${b.hi/1000} GHz`:point?`${show(lo)} ${u}`:`${show(lo)}\u2013${show(hi)} ${u}`,band:isBand?b.key:null};
}
function overlaps(r,f){if(!f)return true;return f.point?(r.from_mhz<=f.lo&&r.to_mhz>f.lo):(r.to_mhz>f.lo&&r.from_mhz<f.hi)}
function bandOf(r){const mid=(r.from_mhz+r.to_mhz)/2;return BANDS.find(b=>mid>=b.lo&&mid<b.hi)||{key:'Other',lo:0,hi:0}}

/* ---------- search ---------- */
function runSearch(q){
  S.query=q;S.expanded=new Set();S.viewingSaved=null;
  const j=JUR[q.jur];
  if(!j||(j.withdrawn&&!S.staff)){S.result={kind:'notheld'};S.facets=null;render();return}
  const f=q.freq;
  let rows=j.rows.filter(r=>overlaps(r,f));
  const match=s=>!q.svc||svcKey(s.service)===q.svc;
  const dirOk=s=>!q.dir||s.direction.includes(q.dir);
  if(q.svc||q.dir) rows=rows.filter(r=>[...(q.prim?[]:r.secondary),...r.primary].some(s=>match(s)&&dirOk(s)));
  else if(q.prim) rows=rows.filter(r=>r.primary.length);
  rows.sort((a,b)=>a.from_mhz-b.from_mhz||a.to_mhz-b.to_mhz);
  { // facet counts on the base set (jurisdiction, service, range) so each toggle shows what it will do
    const base=j.rows.filter(r=>overlaps(r,f)&&(!q.svc||[...r.primary,...r.secondary].some(match)));
    const svcOf=r=>[...r.primary,...r.secondary].filter(match);
    const has=(r,d)=>svcOf(r).some(s=>s.direction.includes(d));
    S.facets={down:base.filter(r=>has(r,'space-to-Earth')).length,up:base.filter(r=>has(r,'Earth-to-space')).length,prim:base.filter(r=>q.svc?r.primary.some(match):r.primary.length).length};
  }
  const groups=rows.length?[{band:{key:'All',lo:0,hi:0},rows}]:[]; // v18: one list in frequency order; the band is a search input only
  let kind='ok';
  if(!rows.length){kind=(f&&(f.hi<=WINDOW[0]||f.lo>=WINDOW[1]))?'outside':'empty'}
  S.openBands=new Set(groups.length?[groups[0].band.key]:[]);
  S.result={kind,rows,groups,jur:j,name:q.jur};
  render();
}
function currentQueryFromForm(){
  const jur=$('#jur').value.trim();
  const svcLabel=$('#svc').value.trim();
  const svc=svcLabel?(SERVICES.find(s=>s.label.toLowerCase()===svcLabel.toLowerCase())||SERVICES.find(s=>s.label.toLowerCase().startsWith(svcLabel.toLowerCase())))?.key||null:null;
  const freq=buildFreq($('#band').value,$('#f-from').value,$('#f-to').value,$('#unit').value);
  const dir=$('#dirset').getAttribute('aria-disabled')==='true'?'':(document.querySelector('input[name=dir]:checked')?.value||'');const prim=$('#prim-only').checked;
  return {jur,svc,svcLabel,freq,dir,prim};
}
$('#qform').addEventListener('submit',e=>{
  e.preventDefault();
  if(S.result&&S.result.kind==='ok'&&!S.user&&!S.deviceRecognised){openGate();return}
  const q=currentQueryFromForm();
  const hint=$('#hint');
  const errs=[];
  if(!q.jur)errs.push('Select a jurisdiction.');
  if(q.svcLabel&&!q.svc)errs.push('Service not recognized. Select one from the list.');
  if(q.freq&&q.freq.error)errs.push(q.freq.error);
  hint.querySelectorAll('.err').forEach(x=>x.remove());
  if(errs.length){errs.forEach(m=>{const s=document.createElement('span');s.className='err';s.textContent=m;hint.prepend(s)});return}
  if(q.svc)$('#svc').value=SERVICES.find(s=>s.key===q.svc).label;
  runSearch(q);recordSearch(q);
});

$('#band').innerHTML='<option value="">All bands</option><option value="custom">Custom frequency range</option>'+BANDS.map(b=>`<option value="${b.key}">${b.key} band · ${b.lo/1000}–${b.hi/1000} GHz</option>`).join('');
$('#band').title='Band designations follow IEEE Std 521.';
function syncRefine(){const has=!!$('#svc').value.trim();$('#dirset').setAttribute('aria-disabled',String(!has));$('#dirset').title=has?'':'Select a service to enable direction filtering.';document.querySelectorAll('input[name=dir]').forEach(i=>i.disabled=!has);if(!has)document.querySelector('input[name=dir][value=""]').checked=true;
